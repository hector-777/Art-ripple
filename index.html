<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>光 · 涟漪 — Ripple</title>

    <!-- Google Fonts: 手写花体 -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <!-- 备用字体 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
            background: #06080a;
            color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: none;
        }

        #demo-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #06080a;
            cursor: none;
        }

        #demo-section canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .nav-link {
            position: absolute;
            bottom: 40px;
            left: 44px;
            z-index: 10;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.10);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px 28px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(255, 255, 255, 0.01);
            font-family: inherit;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-link:hover {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-link:active {
            opacity: 0.6;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            right: 44px;
            z-index: 10;
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.02);
            text-align: right;
            line-height: 2;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .nav-link {
                bottom: 24px;
                left: 24px;
                font-size: 9px;
                padding: 8px 18px;
            }
            .hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .nav-link {
                bottom: 16px;
                left: 16px;
                font-size: 8px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <section id="demo-section">
        <a class="nav-link" href="about.html">↗ 关于项目</a>
        <div class="hint">移动 · 光随行<br />涟漪 · 自生发</div>
    </section>

    <script>
        // ============================================================
        //  全局状态
        // ============================================================
        const STATE = {
            nodes: [],
            ripples: [],
            mouseX: -9999,
            mouseY: -9999,
            mouseInside: false,
            frame: 0,
            audioCtx: null,
            bellTimer: null,
            autoRippleTimer: null,
            isMobile: false,
        };

        // ============================================================
        //  Canvas 初始化
        // ============================================================
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const demoSection = document.getElementById('demo-section');
        demoSection.prepend(canvas);

        let W, H, dpr = 1;

        // ============================================================
        //  检测设备
        // ============================================================
        function checkMobile() {
            STATE.isMobile = window.innerWidth <= 768 || ('ontouchstart' in window && window.innerWidth <= 1024);
            return STATE.isMobile;
        }

        // ============================================================
        //  参数
        // ============================================================
        const PARAMS = {
            nodeCountDesktop: 150,
            nodeCountMobile: 70,

            lightRadius: 170,
            nodeTriggerDist: 75,
            rippleSpeedBase: 0.45,
            rippleDecay: 0.27,
            minStrength: 1.0,
            nodeBaseBrightness: 0.012,
            nodeBrightnessFactor: 1.2,
            lineBaseAlpha: 0.008,
            lineBrightnessFactor: 0.18,

            rippleAlphaBase: 0.24,
            rippleCooldown: 500, // 毫秒，节点涟漪冷却时间

            // 波浪参数增强
            waveDistortion: 1.2, // 增大扭曲幅度
            waveFrequency: 3.5, // 提高频率，产生更多波浪细节

            floatAmplitude: 0.8,
            floatSpeed: 0.004,

            pushRadius: 100,
            pushStrength: 10,
            springConstant: 0.025,
            damping: 0.96,

            autoRippleIntervalMin: 10000,
            autoRippleIntervalMax: 15000,

            mouseGlowIntensity: 0.10,
            mouseMidGlow: 0.06,
            mouseCoreGlow: 0.25,
            mouseInnerGlow: 0.10,

            // ===== 标题参数（手写花体 Great Vibes） =====
            titleText: 'RIPPLE',
            titleSize: 0.075,
            titleY: 0.18,
            titleLetterSpacing: 0.06,

            glowLayerAlpha: 0.30,
            glowLayerBlur: 45,

            textLayerAlpha: 0.55,
            textLayerGlow: 8,
            textLayerGlowAlpha: 0.08,
        };

        // ============================================================
        //  生成普通节点
        // ============================================================
        function generateNodes() {
            const allNodes = [];
            const isMobile = checkMobile();
            const targetCount = isMobile ? PARAMS.nodeCountMobile : PARAMS.nodeCountDesktop;

            const minDist = Math.min(W, H) * 0.032;
            const margin = 30;
            let attempts = 0;
            const maxAttempts = 10000;

            const titleRegionY = H * 0.05;
            const titleRegionH = H * 0.25;
            const titleRegionX = W * 0.10;
            const titleRegionW = W * 0.80;

            const brightnessLevels = [];
            for (let i = 0; i < targetCount; i++) {
                brightnessLevels.push(0.1 + Math.random() * 0.9);
            }

            const tempNodes = [];
            let idx = 0;
            while (tempNodes.length < targetCount && attempts < maxAttempts) {
                attempts++;
                const x = margin + Math.random() * (W - 2 * margin);
                const y = margin + Math.random() * (H - 2 * margin);

                const inTitleRegion = y > titleRegionY && y < titleRegionY + titleRegionH &&
                    x > titleRegionX && x < titleRegionX + titleRegionW;
                let skip = false;
                if (inTitleRegion && Math.random() > 0.25) {
                    skip = true;
                }

                if (!skip) {
                    let tooClose = false;
                    for (let n of tempNodes) {
                        const dx = n.x - x;
                        const dy = n.y - y;
                        if (dx * dx + dy * dy < minDist * minDist) { tooClose = true; break; }
                    }
                    if (!tooClose) {
                        const brightBase = brightnessLevels[idx % brightnessLevels.length];
                        tempNodes.push({
                            id: allNodes.length,
                            x: x,
                            y: y,
                            baseX: x,
                            baseY: y,
                            brightness: brightBase * 0.3,
                            targetBrightness: 0,
                            phase: Math.random() * Math.PI * 2,
                            waveOffset: Math.random() * 100,
                            vx: 0,
                            vy: 0,
                            baseBrightness: brightBase,
                            // 涟漪冷却时间戳
                            lastRippleTime: 0,
                        });
                        idx++;
                    }
                }
            }
            allNodes.push(...tempNodes);

            STATE.nodes = allNodes;
            console.log(`✦ 生成 ${allNodes.length} 个节点 (手机模式: ${isMobile})`);
        }

        // ============================================================
        //  绘制手写花体标题（Great Vibes + 透明质感）
        // ============================================================
        function drawTitle() {
            const text = PARAMS.titleText;
            const fontSize = Math.min(W * PARAMS.titleSize, H * 0.12);
            const baseY = H * PARAMS.titleY;
            const cx = W / 2;
            const cy = baseY;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 使用 Great Vibes 手写花体 + 备用字体
            const fontFamily = '"Great Vibes", "Alex Brush", "Tangerine", "Georgia", serif';
            ctx.font = `${fontSize}px ${fontFamily}`;

            // ---- 底层光晕 ----
            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.3})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur * 1.5;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.15;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.12})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.4})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.30;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.15})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.6})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur * 0.5;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.40;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.20})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            // ---- 字母独立光晕圈 ----
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charOffset = (i - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const charX = cx + charOffset;
                const charY = cy;

                for (let ring = 0; ring < 3; ring++) {
                    const radius = fontSize * (0.4 + ring * 0.35) + Math.sin(STATE.frame * 0.01 + i * 0.5 + ring) * 2.5;
                    const grad = ctx.createRadialGradient(
                        charX, charY + 2, 0,
                        charX, charY + 2, radius
                    );
                    const alpha = 0.04 - ring * 0.01 + 0.02 * Math.sin(STATE.frame * 0.008 + i + ring * 0.5);
                    grad.addColorStop(0, `rgba(220,225,235,${Math.max(alpha, 0.002)})`);
                    grad.addColorStop(0.5, `rgba(220,225,235,${Math.max(alpha * 0.6, 0.001)})`);
                    grad.addColorStop(1, 'rgba(220,225,235,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(charX, charY + 2, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ---- 上层：手写花体字（透明质感） ----
            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.textLayerGlowAlpha})`;
            ctx.shadowBlur = PARAMS.textLayerGlow;
            ctx.globalAlpha = PARAMS.textLayerAlpha * 0.7;
            ctx.fillStyle = `rgba(235,240,248,${PARAMS.textLayerAlpha * 0.8})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = PARAMS.textLayerAlpha * 0.85;
            ctx.fillStyle = `rgba(245,248,252,${PARAMS.textLayerAlpha * 0.9})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.08;
            ctx.strokeStyle = 'rgba(200,210,225,0.15)';
            ctx.lineWidth = 0.4;
            ctx.strokeText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillText(text, cx - 1, cy);
            ctx.restore();

            // ---- 装饰元素 ----
            for (let i = 0; i < text.length - 1; i++) {
                const charOffset1 = (i - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const charOffset2 = (i + 1 - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const midX = cx + (charOffset1 + charOffset2) / 2;
                const dotY = cy + fontSize * 0.28 + Math.sin(STATE.frame * 0.01 + i * 1.1) * 2;
                const dotSize = 0.6 + 0.5 * Math.sin(STATE.frame * 0.015 + i * 0.7);
                ctx.beginPath();
                ctx.arc(midX, dotY, dotSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,210,225,${0.04 + 0.015 * Math.sin(STATE.frame * 0.01 + i)})`;
                ctx.fill();
            }

            const totalWidth = text.length * fontSize * (0.75 + PARAMS.titleLetterSpacing);
            const lineY = cy + fontSize * 0.58 + Math.sin(STATE.frame * 0.008) * 1.5;
            const lineStartX = cx - totalWidth * 0.48;
            const lineEndX = cx + totalWidth * 0.48;

            ctx.beginPath();
            ctx.moveTo(lineStartX, lineY);
            ctx.lineTo(lineEndX, lineY);
            ctx.strokeStyle = `rgba(200,210,225,${0.025 + 0.01 * Math.sin(STATE.frame * 0.01)})`;
            ctx.lineWidth = 0.3;
            ctx.stroke();

            const lineY2 = lineY + 5 + Math.sin(STATE.frame * 0.012 + 0.5) * 1.5;
            ctx.beginPath();
            ctx.moveTo(lineStartX + 15, lineY2);
            ctx.lineTo(lineEndX - 15, lineY2);
            ctx.strokeStyle = `rgba(200,210,225,${0.015 + 0.006 * Math.sin(STATE.frame * 0.012)})`;
            ctx.lineWidth = 0.2;
            ctx.stroke();

            const dotPositions = [
                [lineStartX, lineY],
                [lineEndX, lineY],
                [lineStartX + 8, lineY2],
                [lineEndX - 8, lineY2]
            ];
            for (let dp of dotPositions) {
                const ds = 0.5 + 0.3 * Math.sin(STATE.frame * 0.01 + dp[0]);
                ctx.beginPath();
                ctx.arc(dp[0], dp[1], ds, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,210,225,${0.025 + 0.015 * Math.sin(STATE.frame * 0.01 + dp[0])})`;
                ctx.fill();
            }
        }

        // ============================================================
        //  音频系统
        // ============================================================
        function initAudio() {
            if (STATE.audioCtx) return;
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                STATE.audioCtx = ctx;

                const drone = ctx.createOscillator();
                drone.type = 'sine';
                drone.frequency.value = 55;
                const droneGain = ctx.createGain();
                droneGain.gain.value = 0.012;
                drone.connect(droneGain);
                droneGain.connect(ctx.destination);
                drone.start();

                const lfo = ctx.createOscillator();
                lfo.frequency.value = 0.15;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 5;
                lfo.connect(lfoGain);
                lfoGain.connect(drone.frequency);
                lfo.start();

                scheduleBell();
                console.log('✦ 环境音已启动');
            } catch (e) { console.warn('音频初始化失败:', e); }
        }

        function scheduleBell() {
            if (!STATE.audioCtx) return;
            const delay = 3000 + Math.random() * 8000;
            STATE.bellTimer = setTimeout(() => {
                playBell();
                scheduleBell();
            }, delay);
        }

        function playBell() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx) return;
                const freqs = [523, 587, 659, 784, 880, 988];
                const freq = freqs[Math.floor(Math.random() * freqs.length)] * (0.98 + Math.random() * 0.04);
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = freq * 2.0;
                osc2.gain.value = 0.3;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.03, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5 + Math.random() * 1.0);
                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.01, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0 + Math.random() * 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1.8 + Math.random() * 1.2);
                osc2.start(ctx.currentTime + 0.05);
                osc2.stop(ctx.currentTime + 1.5 + Math.random() * 1.0);
            } catch (e) {}
        }

        // ============================================================
        //  涟漪系统（带冷却 + 增强波浪）
        // ============================================================
        function createRipple(x, y, strength, maxRadiusOverride) {
            const speed = PARAMS.rippleSpeedBase + strength * 0.006 + (Math.random() - 0.5) * 0.08;
            const maxRadius = maxRadiusOverride || (45 + strength * 2.0 + Math.random() * 20);
            STATE.ripples.push({
                x,
                y,
                radius: 0,
                maxRadius,
                life: 1.0,
                speed,
                strength,
                triggeredSet: new Set(),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.4 + Math.random() * 0.8, // 更大的随机幅度
                randomAngle: Math.random() * Math.PI * 2,
                // 每层涟漪独立的波动参数
                wavePhase: Math.random() * Math.PI * 2,
            });
        }

        function triggerNodeRipple(node, strength) {
            // 冷却检查：0.5 秒内只触发一次
            const now = performance.now();
            if (node.lastRippleTime && (now - node.lastRippleTime) < PARAMS.rippleCooldown) {
                return;
            }
            node.lastRippleTime = now;

            const s = strength * (0.7 + Math.random() * 0.6);
            const maxR = 30 + s * 1.8 + Math.random() * 15;
            STATE.ripples.push({
                x: node.x,
                y: node.y,
                radius: 0,
                maxRadius: maxR,
                life: 1.0,
                speed: PARAMS.rippleSpeedBase + s * 0.005 + (Math.random() - 0.5) * 0.05,
                strength: s,
                triggeredSet: new Set([node.id]),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.3 + Math.random() * 0.7,
                randomAngle: Math.random() * Math.PI * 2,
                isSecondary: true,
                wavePhase: Math.random() * Math.PI * 2,
            });
        }

        function updateRipples() {
            const toRemove = [];
            for (let i = 0; i < STATE.ripples.length; i++) {
                const ripple = STATE.ripples[i];
                if (!ripple.isActive) continue;
                ripple.radius += ripple.speed;
                ripple.life -= 0.005;
                if (ripple.life <= 0 || ripple.radius > ripple.maxRadius) {
                    ripple.isActive = false;
                    toRemove.push(i);
                    continue;
                }
                if (ripple.strength < PARAMS.minStrength) continue;
                const newStrength = ripple.strength * PARAMS.rippleDecay * (0.9 + Math.random() * 0.2);
                if (newStrength < PARAMS.minStrength) continue;
                for (let node of STATE.nodes) {
                    if (ripple.triggeredSet.has(node.id)) continue;
                    const dx = node.x - ripple.x;
                    const dy = node.y - ripple.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const threshold = ripple.radius + 2 + (Math.random() - 0.5) * 4;
                    if (dist < threshold) {
                        ripple.triggeredSet.add(node.id);
                        setTimeout(() => {
                            triggerNodeRipple(node, newStrength);
                        }, Math.random() * 80);
                    }
                }
            }
            for (let i = toRemove.length - 1; i >= 0; i--) {
                STATE.ripples.splice(toRemove[i], 1);
            }
        }

        // ============================================================
        //  自动涟漪
        // ============================================================
        function scheduleAutoRipple() {
            const delay = PARAMS.autoRippleIntervalMin +
                Math.random() * (PARAMS.autoRippleIntervalMax - PARAMS.autoRippleIntervalMin);
            STATE.autoRippleTimer = setTimeout(() => {
                triggerAutoRipple();
                scheduleAutoRipple();
            }, delay);
        }

        function triggerAutoRipple() {
            const shuffled = [...STATE.nodes].sort(() => Math.random() - 0.5);
            const count = 1 + Math.floor(Math.random() * 2);
            const selected = shuffled.slice(0, count);

            for (let node of selected) {
                node.targetBrightness = 0.9 + Math.random() * 0.1;
                setTimeout(() => {
                    node.targetBrightness = 0.3;
                }, 300);

                const strength = 8 + Math.random() * 6;
                // 自动涟漪也要遵循冷却
                const now = performance.now();
                if (!node.lastRippleTime || (now - node.lastRippleTime) >= PARAMS.rippleCooldown) {
                    node.lastRippleTime = now;
                    createRipple(node.x, node.y, strength);
                    playBell();
                }
            }
        }

        // ============================================================
        //  鼠标 / 触摸
        // ============================================================
        function getPos(e) {
            const rect = demoSection.getBoundingClientRect();
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX - rect.left;
                cy = e.touches[0].clientY - rect.top;
                e.preventDefault();
            } else {
                cx = e.clientX - rect.left;
                cy = e.clientY - rect.top;
            }
            return { x: cx, y: cy };
        }

        function onMove(e) {
            const pos = getPos(e);
            STATE.mouseX = pos.x;
            STATE.mouseY = pos.y;
            STATE.mouseInside = true;
            if (!STATE.audioCtx) initAudio();
        }

        function onLeave() { STATE.mouseInside = false; }

        function onTap(e) {
            const pos = getPos(e);
            const strength = 20 + Math.random() * 10;
            const maxR = 100 + Math.random() * 60;
            createRipple(pos.x, pos.y, strength, maxR);
            playBell();
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseleave', onLeave);
        window.addEventListener('click', onTap);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchstart', onTap, { passive: false });
        window.addEventListener('touchend', onLeave, { passive: false });

        // ============================================================
        //  Resize
        // ============================================================
        function resize() {
            const rect = demoSection.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            generateNodes();

            if (STATE.autoRippleTimer) {
                clearTimeout(STATE.autoRippleTimer);
            }
            scheduleAutoRipple();
        }

        window.addEventListener('resize', resize);

        // ============================================================
        //  渲染循环
        // ============================================================
        function draw() {
            STATE.frame++;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#06080a';
            ctx.fillRect(0, 0, W, H);

            const mx = STATE.mouseX;
            const my = STATE.mouseY;
            const inside = STATE.mouseInside;

            // ---- 更新节点 ----
            for (let node of STATE.nodes) {
                const floatOffsetX = Math.sin(STATE.frame * PARAMS.floatSpeed + node.phase) * PARAMS.floatAmplitude;
                const floatOffsetY = Math.cos(STATE.frame * PARAMS.floatSpeed * 0.8 + node.phase * 0.7) * PARAMS
                .floatAmplitude;

                let pushX = 0,
                    pushY = 0;
                if (inside) {
                    const dx = node.baseX + floatOffsetX - mx;
                    const dy = node.baseY + floatOffsetY - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.pushRadius && dist > 1) {
                        const strength = (1 - dist / PARAMS.pushRadius) * PARAMS.pushStrength;
                        pushX = (dx / dist) * strength;
                        pushY = (dy / dist) * strength;
                    }
                }

                const targetX = node.baseX + floatOffsetX + pushX;
                const targetY = node.baseY + floatOffsetY + pushY;

                const springX = (targetX - node.x) * PARAMS.springConstant;
                const springY = (targetY - node.y) * PARAMS.springConstant;
                const damping = PARAMS.damping;
                node.vx = (node.vx + springX) * damping;
                node.vy = (node.vy + springY) * damping;
                node.x += node.vx;
                node.y += node.vy;

                const maxOffset = 60;
                const dxLimit = node.x - node.baseX;
                const dyLimit = node.y - node.baseY;
                if (Math.abs(dxLimit) > maxOffset) node.x = node.baseX + Math.sign(dxLimit) * maxOffset;
                if (Math.abs(dyLimit) > maxOffset) node.y = node.baseY + Math.sign(dyLimit) * maxOffset;

                let distToMouse = 9999;
                if (inside) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    distToMouse = Math.sqrt(dx * dx + dy * dy);
                }

                let targetBright = 0;
                if (inside && distToMouse < PARAMS.lightRadius) {
                    const t = distToMouse / PARAMS.lightRadius;
                    targetBright = (1 - t * t) * PARAMS.nodeBrightnessFactor;
                }

                const baseMult = node.baseBrightness || 0.5;
                targetBright = targetBright * (0.3 + 0.7 * baseMult);

                node.targetBrightness = Math.min(targetBright, 1.0);
                node.brightness += (node.targetBrightness - node.brightness) * 0.05;
                node.phase += 0.003;
            }

            // ---- 更新涟漪 ----
            updateRipples();

            // ---- 绘制普通连线 ----
            const connectDist = Math.min(W, H) * 0.10;
            for (let i = 0; i < STATE.nodes.length; i++) {
                const n1 = STATE.nodes[i];
                if (n1.brightness < 0.01) continue;
                for (let j = i + 1; j < STATE.nodes.length; j++) {
                    const n2 = STATE.nodes[j];
                    const dx = n1.x - n2.x;
                    const dy = n1.y - n2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectDist && dist > 5) {
                        const avgBright = (n1.brightness + n2.brightness) * 0.5;
                        const alpha = PARAMS.lineBaseAlpha + avgBright * PARAMS.lineBrightnessFactor;
                        if (alpha > 0.005) {
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = `rgba(200,210,225,${Math.min(alpha, 0.12)})`;
                            ctx.lineWidth = 0.2 + avgBright * 0.3;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ---- 绘制涟漪（增强波浪感） ----
            for (let ripple of STATE.ripples) {
                if (!ripple.isActive) continue;
                const life = ripple.life;
                const r = ripple.radius;
                const strength = ripple.strength;
                const baseBright = Math.min(1, strength / 12) * 1.4;
                const alpha = life * baseBright * PARAMS.rippleAlphaBase;
                if (alpha < 0.001) continue;

                const layers = Math.min(5, 3 + Math.floor(strength / 4)); // 增加层数
                for (let layer = 0; layer < layers; layer++) {
                    const offset = layer * 3 * (1 - life * 0.2);
                    const rad = r + offset;
                    if (rad > ripple.maxRadius + 20) continue;
                    const segments = 50 + Math.floor(rad * 0.4);
                    // 每一层的扭曲参数都不同，制造更丰富的波浪
                    const layerWave = ripple.wavePhase + layer * 0.8 + life * 0.5;
                    const distortion = PARAMS.waveDistortion * ripple.distortionAmp *
                        (0.4 + 0.6 * Math.sin(life * 2 + layer * 0.3)) *
                        (1 + 0.3 * Math.sin(rad * 0.05));

                    ctx.beginPath();
                    for (let k = 0; k <= segments; k++) {
                        const angle = (k / segments) * Math.PI * 2;
                        // 多频率波浪叠加，产生不规则的类圆形
                        const wave1 = Math.sin(angle * PARAMS.waveFrequency + STATE.frame * 0.015 + ripple.distortionSeed +
                            layerWave) * distortion * 1.8;
                        const wave2 = Math.cos(angle * 2.3 + STATE.frame * 0.01 + ripple.distortionSeed * 0.7 + layerWave *
                            0.5) * distortion * 1.2;
                        const wave3 = Math.sin(angle * 4.7 + STATE.frame * 0.008 + ripple.distortionSeed * 1.3 + layerWave *
                            0.3) * distortion * 0.7;
                        const wave4 = Math.cos(angle * 1.1 + STATE.frame * 0.012 + ripple.distortionSeed * 0.4 + layerWave *
                            0.7) * distortion * 0.5;
                        const offsetR = (wave1 + wave2 + wave3 + wave4) * 0.2;
                        const finalR = Math.max(0, rad + offsetR);
                        const px = ripple.x + finalR * Math.cos(angle);
                        const py = ripple.y + finalR * Math.sin(angle);
                        if (k === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    const layerAlpha = alpha * (1 - layer / layers) * (0.6 + 0.4 * Math.sin(life * 2.5 + layer));
                    ctx.strokeStyle = `rgba(220,225,235,${Math.min(layerAlpha, 0.18)})`;
                    ctx.lineWidth = 0.2 + (1 - life) * 0.5 + strength * 0.012;
                    ctx.stroke();
                }

                // 中心光点（同样带有波浪感）
                if (life > 0.3) {
                    const centerAlpha = life * Math.min(1, strength / 20) * 0.10;
                    const cSize = 1.5 + (1 - life) * 3 + strength * 0.04;
                    const shiftX = Math.sin(STATE.frame * 0.02 + ripple.distortionSeed) * 0.5;
                    const shiftY = Math.cos(STATE.frame * 0.018 + ripple.distortionSeed * 0.7) * 0.5;
                    ctx.beginPath();
                    ctx.arc(ripple.x + shiftX, ripple.y + shiftY, cSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220,225,235,${Math.min(centerAlpha, 0.15)})`;
                    ctx.fill();
                }
            }

            // ---- 绘制节点 ----
            for (let node of STATE.nodes) {
                const b = node.brightness;
                const baseMult = node.baseBrightness || 0.5;
                const finalBright = Math.max(PARAMS.nodeBaseBrightness * (0.3 + 0.7 * baseMult), b);
                const size = 0.6 + finalBright * 3.0;
                const alpha = Math.min(finalBright * 0.45, 0.35);

                if (finalBright > 0.02) {
                    const glowR = 4 + finalBright * 25;
                    const distX = Math.sin(STATE.frame * 0.005 + node.waveOffset) * 0.3;
                    const distY = Math.cos(STATE.frame * 0.007 + node.waveOffset * 0.8) * 0.3;
                    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowR);
                    grad.addColorStop(0, `rgba(200,210,225,${finalBright * 0.05})`);
                    grad.addColorStop(0.5, `rgba(200,210,225,${finalBright * 0.025})`);
                    grad.addColorStop(1, 'rgba(200,210,225,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(node.x + distX, node.y + distY, glowR, glowR * (0.9 + 0.1 * Math.sin(STATE.frame * 0.01 +
                        node.phase)), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                const grayVal = Math.floor(120 + finalBright * 120);
                ctx.beginPath();
                ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${grayVal},${grayVal + 5},${grayVal + 10},${alpha * 0.9})`;
                ctx.fill();

                if (finalBright > 0.2) {
                    ctx.beginPath();
                    ctx.arc(node.x - size * 0.2, node.y - size * 0.2, size * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(230,235,240,${finalBright * 0.10})`;
                    ctx.fill();
                }
            }

            // ---- 鼠标触发涟漪（带冷却） ----
            if (inside) {
                for (let node of STATE.nodes) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.nodeTriggerDist && node.brightness > 0.08) {
                        let hasRecent = false;
                        for (let r of STATE.ripples) {
                            const d2 = Math.sqrt((r.x - node.x) ** 2 + (r.y - node.y) ** 2);
                            if (d2 < 8 && r.life > 0.5) { hasRecent = true; break; }
                        }
                        if (!hasRecent) {
                            triggerNodeRipple(node, 7 + Math.random() * 4);
                        }
                    }
                }
            }

            // ---- 鼠标光圈 ----
            if (inside && mx > 0 && mx < W && my > 0 && my < H) {
                const mainR = PARAMS.lightRadius;

                const segments = 60;
                const waveAmp = 5 + Math.sin(STATE.frame * 0.015) * 3;
                ctx.beginPath();
                for (let k = 0; k <= segments; k++) {
                    const angle = (k / segments) * Math.PI * 2;
                    const wave1 = Math.sin(angle * 3 + STATE.frame * 0.02) * waveAmp * 0.5;
                    const wave2 = Math.cos(angle * 5 + STATE.frame * 0.015 + 1.2) * waveAmp * 0.3;
                    const wave3 = Math.sin(angle * 7 + STATE.frame * 0.01 + 2.5) * waveAmp * 0.2;
                    const offsetR = wave1 + wave2 + wave3;
                    const finalR = Math.max(mainR + offsetR, 10);
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, mainR + 15);
                grad.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseGlowIntensity})`);
                grad.addColorStop(0.4, `rgba(200,210,225,${PARAMS.mouseGlowIntensity * 0.5})`);
                grad.addColorStop(0.8, `rgba(200,210,225,${PARAMS.mouseGlowIntensity * 0.15})`);
                grad.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad;
                ctx.fill();

                const midR = 45;
                const grad2 = ctx.createRadialGradient(mx, my, 0, mx, my, midR);
                grad2.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseMidGlow})`);
                grad2.addColorStop(0.6, `rgba(200,210,225,${PARAMS.mouseMidGlow * 0.4})`);
                grad2.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(mx, my, midR, 0, Math.PI * 2);
                ctx.fill();

                const pulse = 1 + Math.sin(STATE.frame * 0.02) * 0.06;
                ctx.beginPath();
                ctx.arc(mx, my, 2.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220,230,240,${PARAMS.mouseCoreGlow})`;
                ctx.fill();

                const innerR = 14 * pulse;
                const grad3 = ctx.createRadialGradient(mx, my, 0, mx, my, innerR);
                grad3.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseInnerGlow})`);
                grad3.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(mx, my, innerR, 0, Math.PI * 2);
                ctx.fill();

                const cross = 10;
                ctx.strokeStyle = 'rgba(200,210,225,0.015)';
                ctx.lineWidth = 0.3;
                ctx.beginPath();
                ctx.moveTo(mx - cross, my);
                ctx.lineTo(mx + cross, my);
                ctx.moveTo(mx, my - cross);
                ctx.lineTo(mx, my + cross);
                ctx.stroke();

                const breatheR = 50 + Math.sin(STATE.frame * 0.015) * 4;
                ctx.beginPath();
                for (let k = 0; k <= 50; k++) {
                    const angle = (k / 50) * Math.PI * 2;
                    const bw = Math.sin(angle * 4 + STATE.frame * 0.025) * 2;
                    const finalR = breatheR + bw;
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(200,210,225,0.015)';
                ctx.lineWidth = 0.3;
                ctx.stroke();
            }

            // ---- 绘制标题 ----
            drawTitle();

            // ---- 角落信息 ----
            const rippleCount = STATE.ripples.filter(r => r.isActive).length;
            ctx.fillStyle = 'rgba(200,210,225,0.004)';
            ctx.font = '8px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`涟漪 ${rippleCount} · 节点 ${STATE.nodes.length}`, W - 44, H - 20);

            requestAnimationFrame(draw);
        }

        // ============================================================
        //  启动
        // ============================================================
        resize();
        draw();

        document.addEventListener('click', () => {
            if (!STATE.audioCtx) initAudio();
        }, { once: true });

        console.log('✦ Ripple — 光 · 涟漪');
        console.log('✦ 手写花体标题 · 节点涟漪冷却: 500ms');
        console.log('✦ 增强波浪感 · 不规则类圆形涟漪');
    </script>
</body>
</html>
