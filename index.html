<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光 · 涟漪 — Ripple</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #demo-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #demo-section canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .watermark {
            position: absolute;
            top: 40px;
            left: 44px;
            z-index: 10;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
            pointer-events: none;
            user-select: none;
        }

        .nav-link {
            position: absolute;
            bottom: 40px;
            left: 44px;
            z-index: 10;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 28px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: transparent;
            font-family: inherit;
            user-select: none;
        }

        .nav-link:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
        }

        .hint {
            position: absolute;
            bottom: 40px;
            right: 44px;
            z-index: 10;
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.04);
            text-align: right;
            line-height: 2;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <section id="demo-section">
        <div class="watermark">Ripple</div>
        <a class="nav-link" href="about.html">↗ 关于项目</a>
        <div class="hint">移动 · 光随行<br />涟漪 · 自生发</div>
    </section>

    <script>
        // ============================================================
        //  全局状态
        // ============================================================
        const STATE = {
            nodes: [],
            letterNodes: [],
            ripples: [],
            mouseX: -9999,
            mouseY: -9999,
            mouseInside: false,
            frame: 0,
            audioCtx: null,
            bellTimer: null,
            autoRippleTimer: null,
        };

        // ============================================================
        //  Canvas 初始化
        // ============================================================
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const demoSection = document.getElementById('demo-section');
        demoSection.prepend(canvas);

        let W, H, dpr = 1;

        // ============================================================
        //  参数
        // ============================================================
        const PARAMS = {
            // 普通节点
            nodeCount: 100,
            lightRadius: 170,
            nodeTriggerDist: 75,
            rippleSpeedBase: 0.45,
            rippleDecay: 0.27,
            minStrength: 1.0,
            nodeBaseBrightness: 0.012,
            nodeBrightnessFactor: 1.2,
            lineBaseAlpha: 0.008,
            lineBrightnessFactor: 0.18,
            rippleAlphaBase: 0.16,
            waveDistortion: 0.6,
            waveFrequency: 2.5,

            // 浮动
            floatAmplitude: 0.8,
            floatSpeed: 0.004,

            // 鼠标推开
            pushRadius: 100,
            pushStrength: 22, // 最大推开距离 20-30px

            // 自动涟漪
            autoRippleIntervalMin: 10000,
            autoRippleIntervalMax: 15000,

            // 字母节点
            letterBrightnessBoost: 1.8,
            letterGlowRadius: 35,
        };

        // ============================================================
        //  字母「Ripple」节点坐标（相对位置，占画面宽度 30%）
        // ============================================================
        function getLetterPositions(w, h) {
            // 字母占画面宽度的 30%，居中，距顶部 20%
            const totalWidth = w * 0.30;
            const startX = (w - totalWidth) / 2;
            const baseY = h * 0.20;

            // 每个字母的相对宽度（比例）
            const letterWidths = {
                R: 0.22,
                i: 0.08,
                p: 0.18,
                p: 0.18,
                l: 0.08,
                e: 0.18,
            };
            const totalRatio = Object.values(letterWidths).reduce((a, b) => a + b, 0);
            const gapRatio = 0.04;
            const totalWithGap = totalRatio + gapRatio * 5;

            let currentX = startX;
            const letterData = [];

            const letters = ['R', 'i', 'p', 'p', 'l', 'e'];
            for (let idx = 0; idx < letters.length; idx++) {
                const char = letters[idx];
                const widthRatio = letterWidths[char] / totalWithGap;
                const lw = totalWidth * widthRatio;
                const lh = lw * 1.2;

                const cx = currentX + lw / 2;
                const cy = baseY + lh / 2;
                const size = lw * 0.35;

                const nodes = getCharNodes(char, cx, cy, size);
                letterData.push({
                    char: char,
                    nodes: nodes,
                    cx: cx,
                    cy: cy,
                    width: lw,
                });

                currentX += lw + totalWidth * gapRatio;
            }

            return letterData;
        }

        function getCharNodes(char, cx, cy, s) {
            // 每个字母返回 4-6 个节点坐标（相对于中心 cx, cy，s 为缩放）
            const pts = [];
            const add = (x, y) => pts.push({ x: cx + x * s, y: cy + y * s });

            switch (char) {
                case 'R':
                    add(-0.5, -0.9);
                    add(-0.5, 0.0);
                    add(-0.5, 0.9);
                    add(0.2, -0.4);
                    add(0.5, -0.9);
                    add(0.5, 0.0);
                    add(0.2, 0.5);
                    break;
                case 'i':
                    add(0.0, -0.9);
                    add(0.0, -0.2);
                    add(0.0, 0.3);
                    add(0.0, 0.8);
                    // 点（额外节点，稍微偏移）
                    pts.push({ x: cx + 0.0 * s, y: cy - 1.2 * s });
                    break;
                case 'p':
                    add(-0.5, -0.9);
                    add(-0.5, 0.0);
                    add(-0.5, 0.9);
                    add(0.3, -0.4);
                    add(0.5, -0.9);
                    add(0.5, 0.0);
                    add(0.3, 0.4);
                    break;
                case 'l':
                    add(0.0, -0.9);
                    add(0.0, -0.3);
                    add(0.0, 0.3);
                    add(0.0, 0.9);
                    break;
                case 'e':
                    add(-0.5, -0.9);
                    add(-0.5, 0.0);
                    add(-0.5, 0.9);
                    add(0.5, -0.9);
                    add(0.5, 0.0);
                    add(0.5, 0.9);
                    add(0.0, 0.0);
                    break;
                default:
                    add(-0.4, -0.8);
                    add(0.0, 0.0);
                    add(0.4, 0.8);
            }
            return pts;
        }

        // ============================================================
        //  生成节点（普通 + 字母）
        // ============================================================
        function generateNodes() {
            const allNodes = [];

            // ---- 1. 普通随机节点 ----
            const area = W * H;
            const density = 0.0001;
            let targetCount = Math.floor(area * density);
            targetCount = Math.max(70, Math.min(180, targetCount));

            const minDist = Math.min(W, H) * 0.04;
            const margin = 30;
            let attempts = 0;
            const maxAttempts = 5000;

            const tempNodes = [];
            while (tempNodes.length < targetCount && attempts < maxAttempts) {
                attempts++;
                const x = margin + Math.random() * (W - 2 * margin);
                const y = margin + Math.random() * (H - 2 * margin);
                let tooClose = false;
                for (let n of tempNodes) {
                    const dx = n.x - x;
                    const dy = n.y - y;
                    if (dx * dx + dy * dy < minDist * minDist) { tooClose = true; break; }
                }
                if (!tooClose) {
                    tempNodes.push({
                        id: allNodes.length,
                        x: x,
                        y: y,
                        baseX: x,
                        baseY: y,
                        brightness: 0,
                        targetBrightness: 0,
                        phase: Math.random() * Math.PI * 2,
                        waveOffset: Math.random() * 100,
                        isLetter: false,
                        vx: 0,
                        vy: 0,
                    });
                }
            }
            allNodes.push(...tempNodes);

            // ---- 2. 字母节点 ----
            const letterData = getLetterPositions(W, H);
            const letterNodes = [];

            for (let li of letterData) {
                for (let p of li.nodes) {
                    // 检查是否与现有节点太近
                    let tooClose = false;
                    for (let n of allNodes) {
                        const dx = n.x - p.x;
                        const dy = n.y - p.y;
                        if (dx * dx + dy * dy < 400) { tooClose = true; break; }
                    }
                    if (!tooClose) {
                        const node = {
                            id: allNodes.length,
                            x: p.x,
                            y: p.y,
                            baseX: p.x,
                            baseY: p.y,
                            brightness: 0.4, // 初始较亮
                            targetBrightness: 0.6,
                            phase: Math.random() * Math.PI * 2,
                            waveOffset: Math.random() * 100,
                            isLetter: true,
                            vx: 0,
                            vy: 0,
                            letterChar: li.char,
                        };
                        allNodes.push(node);
                        letterNodes.push(node);
                    }
                }
            }

            STATE.nodes = allNodes;
            STATE.letterNodes = letterNodes;

            // ---- 存储字母连线信息 ----
            STATE.letterConnections = [];
            for (let li of letterData) {
                const pts = li.nodes;
                for (let i = 0; i < pts.length - 1; i++) {
                    // 找到对应的节点
                    const n1 = allNodes.find(n => Math.abs(n.x - pts[i].x) < 2 && Math.abs(n.y - pts[i].y) < 2);
                    const n2 = allNodes.find(n => Math.abs(n.x - pts[i + 1].x) < 2 && Math.abs(n.y - pts[i + 1].y) < 2);
                    if (n1 && n2) {
                        STATE.letterConnections.push({ n1, n2 });
                    }
                }
            }

            console.log(`✦ 生成 ${allNodes.length} 个节点 (含 ${letterNodes.length} 个字母节点)`);
        }

        // ============================================================
        //  音频系统
        // ============================================================
        function initAudio() {
            if (STATE.audioCtx) return;
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                STATE.audioCtx = ctx;

                const drone = ctx.createOscillator();
                drone.type = 'sine';
                drone.frequency.value = 55;
                const droneGain = ctx.createGain();
                droneGain.gain.value = 0.015;
                drone.connect(droneGain);
                droneGain.connect(ctx.destination);
                drone.start();

                const lfo = ctx.createOscillator();
                lfo.frequency.value = 0.15;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 5;
                lfo.connect(lfoGain);
                lfoGain.connect(drone.frequency);
                lfo.start();

                scheduleBell();
                console.log('✦ 环境音已启动');
            } catch (e) { console.warn('音频初始化失败:', e); }
        }

        function scheduleBell() {
            if (!STATE.audioCtx) return;
            const delay = 3000 + Math.random() * 8000;
            STATE.bellTimer = setTimeout(() => {
                playBell();
                scheduleBell();
            }, delay);
        }

        function playBell() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx) return;
                const freqs = [523, 587, 659, 784, 880, 988];
                const freq = freqs[Math.floor(Math.random() * freqs.length)] * (0.98 + Math.random() * 0.04);
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = freq * 2.0;
                osc2.gain.value = 0.3;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.035, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5 + Math.random() * 1.0);
                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.012, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0 + Math.random() * 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1.8 + Math.random() * 1.2);
                osc2.start(ctx.currentTime + 0.05);
                osc2.stop(ctx.currentTime + 1.5 + Math.random() * 1.0);
            } catch (e) {}
        }

        // ============================================================
        //  涟漪系统
        // ============================================================
        function createRipple(x, y, strength, maxRadiusOverride) {
            const speed = PARAMS.rippleSpeedBase + strength * 0.006 + (Math.random() - 0.5) * 0.08;
            const maxRadius = maxRadiusOverride || (45 + strength * 2.0 + Math.random() * 20);
            STATE.ripples.push({
                x,
                y,
                radius: 0,
                maxRadius,
                life: 1.0,
                speed,
                strength,
                triggeredSet: new Set(),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.3 + Math.random() * 0.6,
                randomAngle: Math.random() * Math.PI * 2,
            });
        }

        function triggerNodeRipple(node, strength) {
            const s = strength * (0.7 + Math.random() * 0.6);
            const maxR = 30 + s * 1.8 + Math.random() * 15;
            STATE.ripples.push({
                x: node.x,
                y: node.y,
                radius: 0,
                maxRadius: maxR,
                life: 1.0,
                speed: PARAMS.rippleSpeedBase + s * 0.005 + (Math.random() - 0.5) * 0.05,
                strength: s,
                triggeredSet: new Set([node.id]),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.2 + Math.random() * 0.5,
                randomAngle: Math.random() * Math.PI * 2,
                isSecondary: true,
            });
        }

        function updateRipples() {
            const toRemove = [];
            for (let i = 0; i < STATE.ripples.length; i++) {
                const ripple = STATE.ripples[i];
                if (!ripple.isActive) continue;
                ripple.radius += ripple.speed;
                ripple.life -= 0.005;
                if (ripple.life <= 0 || ripple.radius > ripple.maxRadius) {
                    ripple.isActive = false;
                    toRemove.push(i);
                    continue;
                }
                if (ripple.strength < PARAMS.minStrength) continue;
                const newStrength = ripple.strength * PARAMS.rippleDecay * (0.9 + Math.random() * 0.2);
                if (newStrength < PARAMS.minStrength) continue;
                for (let node of STATE.nodes) {
                    if (ripple.triggeredSet.has(node.id)) continue;
                    const dx = node.x - ripple.x;
                    const dy = node.y - ripple.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const threshold = ripple.radius + 2 + (Math.random() - 0.5) * 4;
                    if (dist < threshold) {
                        ripple.triggeredSet.add(node.id);
                        setTimeout(() => {
                            triggerNodeRipple(node, newStrength);
                        }, Math.random() * 80);
                    }
                }
            }
            for (let i = toRemove.length - 1; i >= 0; i--) {
                STATE.ripples.splice(toRemove[i], 1);
            }
        }

        // ============================================================
        //  自动涟漪
        // ============================================================
        function scheduleAutoRipple() {
            const delay = PARAMS.autoRippleIntervalMin +
                Math.random() * (PARAMS.autoRippleIntervalMax - PARAMS.autoRippleIntervalMin);
            STATE.autoRippleTimer = setTimeout(() => {
                triggerAutoRipple();
                scheduleAutoRipple();
            }, delay);
        }

        function triggerAutoRipple() {
            // 随机选 1-2 个节点（优先选字母节点，增加趣味）
            const candidates = [...STATE.letterNodes, ...STATE.nodes];
            const shuffled = candidates.sort(() => Math.random() - 0.5);
            const count = 1 + Math.floor(Math.random() * 2);
            const selected = shuffled.slice(0, count);

            for (let node of selected) {
                // 节点闪亮一下
                node.targetBrightness = 0.9 + Math.random() * 0.1;
                setTimeout(() => {
                    node.targetBrightness = node.isLetter ? 0.6 : 0.3;
                }, 300);

                // 产生涟漪
                const strength = 8 + Math.random() * 6;
                createRipple(node.x, node.y, strength);
                // 微弱的铃声
                playBell();
            }
        }

        // ============================================================
        //  鼠标 / 触摸
        // ============================================================
        function getPos(e) {
            const rect = demoSection.getBoundingClientRect();
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX - rect.left;
                cy = e.touches[0].clientY - rect.top;
                e.preventDefault();
            } else {
                cx = e.clientX - rect.left;
                cy = e.clientY - rect.top;
            }
            return { x: cx, y: cy };
        }

        function onMove(e) {
            const pos = getPos(e);
            STATE.mouseX = pos.x;
            STATE.mouseY = pos.y;
            STATE.mouseInside = true;
            if (!STATE.audioCtx) initAudio();
        }

        function onLeave() { STATE.mouseInside = false; }

        function onTap(e) {
            const pos = getPos(e);
            const strength = 20 + Math.random() * 10;
            const maxR = 100 + Math.random() * 60;
            createRipple(pos.x, pos.y, strength, maxR);
            playBell();
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseleave', onLeave);
        window.addEventListener('click', onTap);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchstart', onTap, { passive: false });
        window.addEventListener('touchend', onLeave, { passive: false });

        // ============================================================
        //  Resize
        // ============================================================
        function resize() {
            const rect = demoSection.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);
            generateNodes();
            // 重启自动涟漪
            if (STATE.autoRippleTimer) {
                clearTimeout(STATE.autoRippleTimer);
            }
            scheduleAutoRipple();
        }

        window.addEventListener('resize', resize);

        // ============================================================
        //  渲染循环
        // ============================================================
        function draw() {
            STATE.frame++;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            const mx = STATE.mouseX;
            const my = STATE.mouseY;
            const inside = STATE.mouseInside;

            // ============================================================
            //  1. 更新节点（含浮动 + 鼠标推开 + 回摆）
            // ============================================================
            for (let node of STATE.nodes) {
                // ---- 1a. 浮动 ----
                const floatOffsetX = Math.sin(STATE.frame * PARAMS.floatSpeed + node.phase) * PARAMS.floatAmplitude;
                const floatOffsetY = Math.cos(STATE.frame * PARAMS.floatSpeed * 0.8 + node.phase * 0.7) * PARAMS
                .floatAmplitude;

                // ---- 1b. 鼠标推开 ----
                let pushX = 0,
                    pushY = 0;
                if (inside) {
                    const dx = node.baseX + floatOffsetX - mx;
                    const dy = node.baseY + floatOffsetY - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.pushRadius && dist > 1) {
                        const strength = (1 - dist / PARAMS.pushRadius) * PARAMS.pushStrength;
                        pushX = (dx / dist) * strength;
                        pushY = (dy / dist) * strength;
                    }
                }

                // ---- 1c. 目标位置 ----
                const targetX = node.baseX + floatOffsetX + pushX;
                const targetY = node.baseY + floatOffsetY + pushY;

                // ---- 1d. 物理模拟（速度 + 阻尼回摆） ----
                const springX = (targetX - node.x) * 0.04;
                const springY = (targetY - node.y) * 0.04;
                const damping = 0.92;
                node.vx = (node.vx + springX) * damping;
                node.vy = (node.vy + springY) * damping;
                node.x += node.vx;
                node.y += node.vy;

                // 微弱的限幅，防止疯狂摆动
                const maxOffset = 60;
                const dxLimit = node.x - node.baseX;
                const dyLimit = node.y - node.baseY;
                if (Math.abs(dxLimit) > maxOffset) node.x = node.baseX + Math.sign(dxLimit) * maxOffset;
                if (Math.abs(dyLimit) > maxOffset) node.y = node.baseY + Math.sign(dyLimit) * maxOffset;

                // ---- 1e. 亮度更新 ----
                let distToMouse = 9999;
                if (inside) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    distToMouse = Math.sqrt(dx * dx + dy * dy);
                }

                let targetBright = 0;
                if (inside && distToMouse < PARAMS.lightRadius) {
                    const t = distToMouse / PARAMS.lightRadius;
                    targetBright = (1 - t * t) * PARAMS.nodeBrightnessFactor;
                }

                // 字母节点基础亮度更高
                if (node.isLetter) {
                    targetBright = Math.max(targetBright, 0.35);
                    targetBright *= PARAMS.letterBrightnessBoost;
                }

                node.targetBrightness = Math.min(targetBright, 1.0);
                node.brightness += (node.targetBrightness - node.brightness) * 0.05;
                node.phase += 0.003;
            }

            // ============================================================
            //  2. 更新涟漪
            // ============================================================
            updateRipples();

            // ============================================================
            //  3. 绘制字母连线（高亮）
            // ============================================================
            if (STATE.letterConnections) {
                for (let conn of STATE.letterConnections) {
                    const n1 = conn.n1;
                    const n2 = conn.n2;
                    if (!n1 || !n2) continue;
                    const avgBright = (n1.brightness + n2.brightness) * 0.5;
                    const alpha = 0.2 + avgBright * 0.5;
                    ctx.beginPath();
                    ctx.moveTo(n1.x, n1.y);
                    ctx.lineTo(n2.x, n2.y);
                    ctx.strokeStyle = `rgba(255,255,255,${Math.min(alpha, 0.6)})`;
                    ctx.lineWidth = 1.0 + avgBright * 1.0;
                    ctx.stroke();
                }
            }

            // ============================================================
            //  4. 绘制普通连线（背景）
            // ============================================================
            const connectDist = Math.min(W, H) * 0.10;
            for (let i = 0; i < STATE.nodes.length; i++) {
                const n1 = STATE.nodes[i];
                if (n1.brightness < 0.01) continue;
                if (n1.isLetter) continue; // 字母节点连线已单独绘制
                for (let j = i + 1; j < STATE.nodes.length; j++) {
                    const n2 = STATE.nodes[j];
                    if (n2.isLetter) continue;
                    const dx = n1.x - n2.x;
                    const dy = n1.y - n2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectDist && dist > 5) {
                        const avgBright = (n1.brightness + n2.brightness) * 0.5;
                        const alpha = PARAMS.lineBaseAlpha + avgBright * PARAMS.lineBrightnessFactor;
                        if (alpha > 0.005) {
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = `rgba(255,255,255,${Math.min(alpha, 0.15)})`;
                            ctx.lineWidth = 0.2 + avgBright * 0.3;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ============================================================
            //  5. 绘制涟漪
            // ============================================================
            for (let ripple of STATE.ripples) {
                if (!ripple.isActive) continue;
                const life = ripple.life;
                const r = ripple.radius;
                const strength = ripple.strength;
                const baseBright = Math.min(1, strength / 12) * 1.2;
                const alpha = life * baseBright * PARAMS.rippleAlphaBase;
                if (alpha < 0.001) continue;

                const layers = Math.min(4, 2 + Math.floor(strength / 5));
                for (let layer = 0; layer < layers; layer++) {
                    const offset = layer * 3 * (1 - life * 0.2);
                    const rad = r + offset;
                    if (rad > ripple.maxRadius + 15) continue;
                    const segments = 40 + Math.floor(rad * 0.3);
                    const distortion = PARAMS.waveDistortion * ripple.distortionAmp * (0.5 + 0.5 * Math.sin(life * 2));
                    ctx.beginPath();
                    for (let k = 0; k <= segments; k++) {
                        const angle = (k / segments) * Math.PI * 2;
                        const wave1 = Math.sin(angle * PARAMS.waveFrequency + STATE.frame * 0.015 + ripple.distortionSeed) *
                            distortion * 2;
                        const wave2 = Math.cos(angle * 1.3 + STATE.frame * 0.01 + ripple.distortionSeed * 0.7) * distortion *
                            1.2;
                        const wave3 = Math.sin(angle * 2.7 + STATE.frame * 0.008 + ripple.distortionSeed * 1.3) * distortion *
                            0.8;
                        const offsetR = (wave1 + wave2 + wave3) * 0.15;
                        const finalR = Math.max(0, rad + offsetR);
                        const px = ripple.x + finalR * Math.cos(angle);
                        const py = ripple.y + finalR * Math.sin(angle);
                        if (k === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    const layerAlpha = alpha * (1 - layer / layers) * (0.7 + 0.3 * Math.sin(life * 3 + layer));
                    ctx.strokeStyle = `rgba(255,255,255,${Math.min(layerAlpha, 0.12)})`;
                    ctx.lineWidth = 0.2 + (1 - life) * 0.5 + strength * 0.01;
                    ctx.stroke();
                }
                if (life > 0.3) {
                    const centerAlpha = life * Math.min(1, strength / 20) * 0.08;
                    const cSize = 1 + (1 - life) * 2.5 + strength * 0.02;
                    const shiftX = Math.sin(STATE.frame * 0.02 + ripple.distortionSeed) * 0.5;
                    const shiftY = Math.cos(STATE.frame * 0.018 + ripple.distortionSeed * 0.7) * 0.5;
                    ctx.beginPath();
                    ctx.arc(ripple.x + shiftX, ripple.y + shiftY, cSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${Math.min(centerAlpha, 0.12)})`;
                    ctx.fill();
                }
            }

            // ============================================================
            //  6. 绘制节点
            // ============================================================
            for (let node of STATE.nodes) {
                const b = node.brightness;
                const finalBright = Math.max(PARAMS.nodeBaseBrightness, b);
                const size = 0.6 + finalBright * 3.0;
                const alpha = Math.min(finalBright * 0.5, 0.4);

                // 光晕（字母节点更大）
                const glowMult = node.isLetter ? 1.8 : 1.0;
                if (finalBright > 0.02) {
                    const glowR = (4 + finalBright * 22) * glowMult;
                    const distX = Math.sin(STATE.frame * 0.005 + node.waveOffset) * 0.3;
                    const distY = Math.cos(STATE.frame * 0.007 + node.waveOffset * 0.8) * 0.3;
                    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowR);
                    grad.addColorStop(0, `rgba(255,255,255,${finalBright * 0.05 * glowMult})`);
                    grad.addColorStop(0.5, `rgba(255,255,255,${finalBright * 0.025 * glowMult})`);
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(node.x + distX, node.y + distY, glowR, glowR * (0.9 + 0.1 * Math.sin(STATE.frame * 0.01 +
                        node.phase)), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 节点核心
                const coreSize = node.isLetter ? size * 1.3 : size;
                ctx.beginPath();
                ctx.arc(node.x, node.y, coreSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fill();

                // 高光点
                if (finalBright > 0.2) {
                    ctx.beginPath();
                    ctx.arc(node.x - coreSize * 0.2, node.y - coreSize * 0.2, coreSize * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${finalBright * 0.12})`;
                    ctx.fill();
                }
            }

            // ============================================================
            //  7. 鼠标触发节点涟漪
            // ============================================================
            if (inside) {
                for (let node of STATE.nodes) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.nodeTriggerDist && node.brightness > 0.08) {
                        let hasRecent = false;
                        for (let r of STATE.ripples) {
                            const d2 = Math.sqrt((r.x - node.x) ** 2 + (r.y - node.y) ** 2);
                            if (d2 < 8 && r.life > 0.5) { hasRecent = true; break; }
                        }
                        if (!hasRecent) {
                            triggerNodeRipple(node, 7 + Math.random() * 4);
                        }
                    }
                }
            }

            // ============================================================
            //  8. 鼠标光圈（边缘波浪感）
            // ============================================================
            if (inside && mx > 0 && mx < W && my > 0 && my < H) {
                const mainR = PARAMS.lightRadius;

                // ---- 主光晕（边缘波浪变形） ----
                const segments = 60;
                const waveAmp = 4 + Math.sin(STATE.frame * 0.015) * 2;
                ctx.beginPath();
                for (let k = 0; k <= segments; k++) {
                    const angle = (k / segments) * Math.PI * 2;
                    // 波浪变形：叠加多个正弦波
                    const wave1 = Math.sin(angle * 3 + STATE.frame * 0.02) * waveAmp * 0.5;
                    const wave2 = Math.cos(angle * 5 + STATE.frame * 0.015 + 1.2) * waveAmp * 0.3;
                    const wave3 = Math.sin(angle * 7 + STATE.frame * 0.01 + 2.5) * waveAmp * 0.2;
                    const offsetR = wave1 + wave2 + wave3;
                    const finalR = Math.max(mainR + offsetR, 10);
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, mainR + 15);
                grad.addColorStop(0, 'rgba(255,255,255,0.06)');
                grad.addColorStop(0.4, 'rgba(255,255,255,0.03)');
                grad.addColorStop(0.8, 'rgba(255,255,255,0.01)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fill();

                // ---- 中圈 ----
                const midR = 45;
                const grad2 = ctx.createRadialGradient(mx, my, 0, mx, my, midR);
                grad2.addColorStop(0, 'rgba(255,255,255,0.045)');
                grad2.addColorStop(0.6, 'rgba(255,255,255,0.015)');
                grad2.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(mx, my, midR, 0, Math.PI * 2);
                ctx.fill();

                // ---- 核心亮点 ----
                const pulse = 1 + Math.sin(STATE.frame * 0.02) * 0.06;
                ctx.beginPath();
                ctx.arc(mx, my, 2 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.fill();

                // ---- 内圈微光 ----
                const innerR = 12 * pulse;
                const grad3 = ctx.createRadialGradient(mx, my, 0, mx, my, innerR);
                grad3.addColorStop(0, 'rgba(255,255,255,0.07)');
                grad3.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(mx, my, innerR, 0, Math.PI * 2);
                ctx.fill();

                // ---- 极细十字 ----
                const cross = 10;
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 0.3;
                ctx.beginPath();
                ctx.moveTo(mx - cross, my);
                ctx.lineTo(mx + cross, my);
                ctx.moveTo(mx, my - cross);
                ctx.lineTo(mx, my + cross);
                ctx.stroke();

                // ---- 外圈呼吸环（带波浪） ----
                const breatheR = 50 + Math.sin(STATE.frame * 0.015) * 4;
                ctx.beginPath();
                for (let k = 0; k <= 50; k++) {
                    const angle = (k / 50) * Math.PI * 2;
                    const bw = Math.sin(angle * 4 + STATE.frame * 0.025) * 2;
                    const finalR = breatheR + bw;
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.015)';
                ctx.lineWidth = 0.3;
                ctx.stroke();
            }

            // ---- 角落信息 ----
            const rippleCount = STATE.ripples.filter(r => r.isActive).length;
            ctx.fillStyle = 'rgba(255,255,255,0.008)';
            ctx.font = '8px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`涟漪 ${rippleCount} · 节点 ${STATE.nodes.length}`, W - 44, H - 20);

            requestAnimationFrame(draw);
        }

        // ============================================================
        //  启动
        // ============================================================
        resize();
        draw();

        document.addEventListener('click', () => {
            if (!STATE.audioCtx) initAudio();
        }, { once: true });

        console.log('✦ Ripple — 光 · 涟漪');
        console.log('✦ 标题用节点拼成 · 节点浮动 · 鼠标推开 · 自动涟漪');
        console.log('✦ 鼠标光圈边缘波浪 · 环境音');
    </script>
</body>
</html>
