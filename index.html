<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>光 · 涟漪 — Ripple</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: none;
        }

        #demo-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            cursor: none;
        }

        #demo-section canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .nav-link {
            position: absolute;
            bottom: 40px;
            left: 44px;
            z-index: 10;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.12);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 28px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: transparent;
            font-family: inherit;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-link:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-link:active {
            opacity: 0.6;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            right: 44px;
            z-index: 10;
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.03);
            text-align: right;
            line-height: 2;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .nav-link {
                bottom: 24px;
                left: 24px;
                font-size: 9px;
                padding: 8px 18px;
            }
            .hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .nav-link {
                bottom: 16px;
                left: 16px;
                font-size: 8px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <section id="demo-section">
        <a class="nav-link" href="about.html">↗ 关于项目</a>
        <div class="hint">移动 · 光随行<br />涟漪 · 自生发</div>
    </section>

    <script>
        // ============================================================
        //  全局状态
        // ============================================================
        const STATE = {
            nodes: [], // 所有节点（普通 + 标题）
            letterNodes: [], // 仅标题节点
            ripples: [],
            mouseX: -9999,
            mouseY: -9999,
            mouseInside: false,
            frame: 0,
            audioCtx: null,
            bellTimer: null,
            autoRippleTimer: null,
            isMobile: false,
            // 标题字母连接关系（固定）
            letterConnections: [],
        };

        // ============================================================
        //  Canvas 初始化
        // ============================================================
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const demoSection = document.getElementById('demo-section');
        demoSection.prepend(canvas);

        let W, H, dpr = 1;

        // ============================================================
        //  检测设备
        // ============================================================
        function checkMobile() {
            STATE.isMobile = window.innerWidth <= 768 || ('ontouchstart' in window && window.innerWidth <= 1024);
            return STATE.isMobile;
        }

        // ============================================================
        //  参数
        // ============================================================
        const PARAMS = {
            nodeCountDesktop: 140,
            nodeCountMobile: 70,

            lightRadius: 170,
            nodeTriggerDist: 75,
            rippleSpeedBase: 0.45,
            rippleDecay: 0.27,
            minStrength: 1.0,
            nodeBaseBrightness: 0.012,
            nodeBrightnessFactor: 1.2,
            lineBaseAlpha: 0.008,
            lineBrightnessFactor: 0.18,

            rippleAlphaBase: 0.24,

            waveDistortion: 0.6,
            waveFrequency: 2.5,

            // 浮动
            floatAmplitude: 0.8,
            floatSpeed: 0.004,

            // 鼠标推开
            pushRadius: 100,
            pushStrength: 10, // 普通节点推开幅度
            letterPushStrength: 4, // 标题节点推开幅度（更小）
            springConstant: 0.025,
            damping: 0.96,

            // 自动涟漪
            autoRippleIntervalMin: 10000,
            autoRippleIntervalMax: 15000,

            // 鼠标光圈亮度
            mouseGlowIntensity: 0.12,
            mouseMidGlow: 0.08,
            mouseCoreGlow: 0.30,
            mouseInnerGlow: 0.14,

            // 标题节点
            titleWidth: 0.32, // 占画面宽度比例
            titleY: 0.18, // 距顶部比例
            letterNodeSize: 1.6, // 标题节点尺寸倍数
            letterBrightnessBoost: 2.2,
            letterLineWidth: 1.8,
        };

        // ============================================================
        //  字母形状库（相对坐标，中心为原点，宽度≈2，高度≈2）
        // ============================================================
        function getCharShape(char) {
            // 每个字母返回一个二维数组 [x, y]，坐标范围约 -1..1
            const shapes = {
                'R': [
                    [-0.7, -0.9],
                    [-0.7, -0.3],
                    [-0.7, 0.3],
                    [-0.2, -0.6],
                    [0.5, -0.9],
                    [0.7, -0.3],
                    [0.7, 0.0],
                    [0.3, 0.5]
                ],
                'I': [
                    [0.0, -0.9],
                    [0.0, -0.4],
                    [0.0, 0.1],
                    [0.0, 0.6],
                    [0.0, 1.0]
                ],
                'P': [
                    [-0.7, -0.9],
                    [-0.7, -0.2],
                    [-0.7, 0.5],
                    [-0.2, -0.7],
                    [0.5, -0.9],
                    [0.7, -0.3],
                    [0.3, 0.0]
                ],
                'L': [
                    [-0.7, -0.9],
                    [-0.7, -0.2],
                    [-0.7, 0.5],
                    [-0.7, 0.9],
                    [0.2, 0.9],
                    [0.7, 0.9]
                ],
                'E': [
                    [-0.7, -0.9],
                    [-0.7, -0.2],
                    [-0.7, 0.5],
                    [-0.7, 0.9],
                    [0.5, -0.9],
                    [0.5, -0.2],
                    [0.5, 0.5],
                    [0.5, 0.9],
                    [0.0, 0.5]
                ],
            };
            return shapes[char] || shapes['R'];
        }

        // ============================================================
        //  生成标题节点（坐标固定）
        // ============================================================
        function buildTitleNodes() {
            const text = 'RIPPLE';
            const chars = text.split('');
            const totalWidth = W * PARAMS.titleWidth;
            const charWidth = totalWidth / chars.length;
            const baseY = H * PARAMS.titleY;
            const scale = charWidth * 0.45; // 每个字母的缩放因子

            const allLetterNodes = [];
            const allConnections = [];

            for (let idx = 0; idx < chars.length; idx++) {
                const char = chars[idx];
                const shape = getCharShape(char);
                const cx = (W - totalWidth) / 2 + idx * charWidth + charWidth / 2;
                const cy = baseY;

                // 生成该字母的节点
                const nodeIds = [];
                for (let p of shape) {
                    const x = cx + p[0] * scale;
                    const y = cy + p[1] * scale;
                    const node = {
                        id: -1, // 稍后分配
                        x: x,
                        y: y,
                        baseX: x,
                        baseY: y,
                        brightness: 0.5 + Math.random() * 0.2,
                        targetBrightness: 0.6,
                        phase: Math.random() * Math.PI * 2,
                        waveOffset: Math.random() * 100,
                        isLetter: true,
                        vx: 0,
                        vy: 0,
                        baseBrightness: 0.8 + Math.random() * 0.2,
                        char: char,
                        charIndex: idx,
                    };
                    allLetterNodes.push(node);
                    nodeIds.push(allLetterNodes.length - 1);
                }

                // 该字母内部连线：相邻节点依次连接，形成轮廓
                for (let i = 0; i < nodeIds.length - 1; i++) {
                    allConnections.push({
                        n1Idx: nodeIds[i],
                        n2Idx: nodeIds[i + 1],
                    });
                }
                // 首尾连接，封闭轮廓（增强可读性）
                if (nodeIds.length > 2) {
                    allConnections.push({
                        n1Idx: nodeIds[nodeIds.length - 1],
                        n2Idx: nodeIds[0],
                    });
                }
            }

            STATE.letterNodes = allLetterNodes;
            STATE.letterConnections = allConnections;
            console.log(`✦ 生成 ${allLetterNodes.length} 个标题节点`);
        }

        // ============================================================
        //  生成普通节点（避开标题区域）
        // ============================================================
        function generateNodes() {
            const allNodes = [];
            const isMobile = checkMobile();
            const targetCount = isMobile ? PARAMS.nodeCountMobile : PARAMS.nodeCountDesktop;

            const minDist = Math.min(W, H) * 0.035;
            const margin = 30;
            let attempts = 0;
            const maxAttempts = 8000;

            const brightnessLevels = [];
            for (let i = 0; i < targetCount; i++) {
                brightnessLevels.push(0.1 + Math.random() * 0.9);
            }

            // 先构建标题节点（为了获取位置，便于避开）
            buildTitleNodes();
            const titlePositions = STATE.letterNodes.map(n => ({ x: n.baseX, y: n.baseY }));

            const tempNodes = [];
            let idx = 0;
            while (tempNodes.length < targetCount && attempts < maxAttempts) {
                attempts++;
                const x = margin + Math.random() * (W - 2 * margin);
                const y = margin + Math.random() * (H - 2 * margin);

                // 避开标题节点（距离标题节点至少 60px）
                let tooCloseToTitle = false;
                for (let tp of titlePositions) {
                    const dx = tp.x - x;
                    const dy = tp.y - y;
                    if (dx * dx + dy * dy < 3600) { tooCloseToTitle = true; break; }
                }
                if (tooCloseToTitle) continue;

                let tooClose = false;
                for (let n of tempNodes) {
                    const dx = n.x - x;
                    const dy = n.y - y;
                    if (dx * dx + dy * dy < minDist * minDist) { tooClose = true; break; }
                }
                if (!tooClose) {
                    const brightBase = brightnessLevels[idx % brightnessLevels.length];
                    tempNodes.push({
                        id: allNodes.length,
                        x: x,
                        y: y,
                        baseX: x,
                        baseY: y,
                        brightness: brightBase * 0.3,
                        targetBrightness: 0,
                        phase: Math.random() * Math.PI * 2,
                        waveOffset: Math.random() * 100,
                        isLetter: false,
                        vx: 0,
                        vy: 0,
                        baseBrightness: brightBase,
                    });
                    idx++;
                }
            }
            allNodes.push(...tempNodes);

            // 合并标题节点到总节点列表
            const allLetterNodes = STATE.letterNodes;
            for (let ln of allLetterNodes) {
                ln.id = allNodes.length;
                allNodes.push(ln);
            }

            STATE.nodes = allNodes;
            console.log(`✦ 生成 ${allNodes.length} 个节点 (含 ${allLetterNodes.length} 个标题节点)`);
        }

        // ============================================================
        //  音频系统
        // ============================================================
        function initAudio() {
            if (STATE.audioCtx) return;
            try {
                const ctx = new(window.AudioContext || window.webkitAudioContext)();
                STATE.audioCtx = ctx;

                const drone = ctx.createOscillator();
                drone.type = 'sine';
                drone.frequency.value = 55;
                const droneGain = ctx.createGain();
                droneGain.gain.value = 0.015;
                drone.connect(droneGain);
                droneGain.connect(ctx.destination);
                drone.start();

                const lfo = ctx.createOscillator();
                lfo.frequency.value = 0.15;
                const lfoGain = ctx.createGain();
                lfoGain.gain.value = 5;
                lfo.connect(lfoGain);
                lfoGain.connect(drone.frequency);
                lfo.start();

                scheduleBell();
                console.log('✦ 环境音已启动');
            } catch (e) { console.warn('音频初始化失败:', e); }
        }

        function scheduleBell() {
            if (!STATE.audioCtx) return;
            const delay = 3000 + Math.random() * 8000;
            STATE.bellTimer = setTimeout(() => {
                playBell();
                scheduleBell();
            }, delay);
        }

        function playBell() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx) return;
                const freqs = [523, 587, 659, 784, 880, 988];
                const freq = freqs[Math.floor(Math.random() * freqs.length)] * (0.98 + Math.random() * 0.04);
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = freq * 2.0;
                osc2.gain.value = 0.3;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.035, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5 + Math.random() * 1.0);
                const gain2 = ctx.createGain();
                gain2.gain.setValueAtTime(0.012, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.0 + Math.random() * 0.8);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1.8 + Math.random() * 1.2);
                osc2.start(ctx.currentTime + 0.05);
                osc2.stop(ctx.currentTime + 1.5 + Math.random() * 1.0);
            } catch (e) {}
        }

        // ============================================================
        //  涟漪系统
        // ============================================================
        function createRipple(x, y, strength, maxRadiusOverride) {
            const speed = PARAMS.rippleSpeedBase + strength * 0.006 + (Math.random() - 0.5) * 0.08;
            const maxRadius = maxRadiusOverride || (45 + strength * 2.0 + Math.random() * 20);
            STATE.ripples.push({
                x,
                y,
                radius: 0,
                maxRadius,
                life: 1.0,
                speed,
                strength,
                triggeredSet: new Set(),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.3 + Math.random() * 0.6,
                randomAngle: Math.random() * Math.PI * 2,
            });
        }

        function triggerNodeRipple(node, strength) {
            const s = strength * (0.7 + Math.random() * 0.6);
            const maxR = 30 + s * 1.8 + Math.random() * 15;
            STATE.ripples.push({
                x: node.x,
                y: node.y,
                radius: 0,
                maxRadius: maxR,
                life: 1.0,
                speed: PARAMS.rippleSpeedBase + s * 0.005 + (Math.random() - 0.5) * 0.05,
                strength: s,
                triggeredSet: new Set([node.id]),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.2 + Math.random() * 0.5,
                randomAngle: Math.random() * Math.PI * 2,
                isSecondary: true,
            });
        }

        function updateRipples() {
            const toRemove = [];
            for (let i = 0; i < STATE.ripples.length; i++) {
                const ripple = STATE.ripples[i];
                if (!ripple.isActive) continue;
                ripple.radius += ripple.speed;
                ripple.life -= 0.005;
                if (ripple.life <= 0 || ripple.radius > ripple.maxRadius) {
                    ripple.isActive = false;
                    toRemove.push(i);
                    continue;
                }
                if (ripple.strength < PARAMS.minStrength) continue;
                const newStrength = ripple.strength * PARAMS.rippleDecay * (0.9 + Math.random() * 0.2);
                if (newStrength < PARAMS.minStrength) continue;
                for (let node of STATE.nodes) {
                    if (ripple.triggeredSet.has(node.id)) continue;
                    const dx = node.x - ripple.x;
                    const dy = node.y - ripple.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const threshold = ripple.radius + 2 + (Math.random() - 0.5) * 4;
                    if (dist < threshold) {
                        ripple.triggeredSet.add(node.id);
                        setTimeout(() => {
                            triggerNodeRipple(node, newStrength);
                        }, Math.random() * 80);
                    }
                }
            }
            for (let i = toRemove.length - 1; i >= 0; i--) {
                STATE.ripples.splice(toRemove[i], 1);
            }
        }

        // ============================================================
        //  自动涟漪
        // ============================================================
        function scheduleAutoRipple() {
            const delay = PARAMS.autoRippleIntervalMin +
                Math.random() * (PARAMS.autoRippleIntervalMax - PARAMS.autoRippleIntervalMin);
            STATE.autoRippleTimer = setTimeout(() => {
                triggerAutoRipple();
                scheduleAutoRipple();
            }, delay);
        }

        function triggerAutoRipple() {
            const shuffled = [...STATE.nodes].sort(() => Math.random() - 0.5);
            const count = 1 + Math.floor(Math.random() * 2);
            const selected = shuffled.slice(0, count);

            for (let node of selected) {
                node.targetBrightness = 0.9 + Math.random() * 0.1;
                setTimeout(() => {
                    node.targetBrightness = node.isLetter ? 0.6 : 0.3;
                }, 300);

                const strength = 8 + Math.random() * 6;
                createRipple(node.x, node.y, strength);
                playBell();
            }
        }

        // ============================================================
        //  鼠标 / 触摸
        // ============================================================
        function getPos(e) {
            const rect = demoSection.getBoundingClientRect();
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX - rect.left;
                cy = e.touches[0].clientY - rect.top;
                e.preventDefault();
            } else {
                cx = e.clientX - rect.left;
                cy = e.clientY - rect.top;
            }
            return { x: cx, y: cy };
        }

        function onMove(e) {
            const pos = getPos(e);
            STATE.mouseX = pos.x;
            STATE.mouseY = pos.y;
            STATE.mouseInside = true;
            if (!STATE.audioCtx) initAudio();
        }

        function onLeave() { STATE.mouseInside = false; }

        function onTap(e) {
            const pos = getPos(e);
            const strength = 20 + Math.random() * 10;
            const maxR = 100 + Math.random() * 60;
            createRipple(pos.x, pos.y, strength, maxR);
            playBell();
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseleave', onLeave);
        window.addEventListener('click', onTap);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchstart', onTap, { passive: false });
        window.addEventListener('touchend', onLeave, { passive: false });

        // ============================================================
        //  Resize
        // ============================================================
        function resize() {
            const rect = demoSection.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            // 重新生成所有节点（标题节点坐标固定）
            generateNodes();

            if (STATE.autoRippleTimer) {
                clearTimeout(STATE.autoRippleTimer);
            }
            scheduleAutoRipple();
        }

        window.addEventListener('resize', resize);

        // ============================================================
        //  渲染循环
        // ============================================================
        function draw() {
            STATE.frame++;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);

            const mx = STATE.mouseX;
            const my = STATE.mouseY;
            const inside = STATE.mouseInside;

            // ============================================================
            //  1. 更新所有节点（浮动 + 鼠标推开 + 物理回摆）
            // ============================================================
            for (let node of STATE.nodes) {
                // 浮动
                const floatOffsetX = Math.sin(STATE.frame * PARAMS.floatSpeed + node.phase) * PARAMS.floatAmplitude;
                const floatOffsetY = Math.cos(STATE.frame * PARAMS.floatSpeed * 0.8 + node.phase * 0.7) * PARAMS
                .floatAmplitude;

                // 鼠标推开
                let pushX = 0,
                    pushY = 0;
                if (inside) {
                    const dx = node.baseX + floatOffsetX - mx;
                    const dy = node.baseY + floatOffsetY - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.pushRadius && dist > 1) {
                        // 标题节点推开幅度更小
                        const maxPush = node.isLetter ? PARAMS.letterPushStrength : PARAMS.pushStrength;
                        const strength = (1 - dist / PARAMS.pushRadius) * maxPush;
                        pushX = (dx / dist) * strength;
                        pushY = (dy / dist) * strength;
                    }
                }

                // 目标位置
                const targetX = node.baseX + floatOffsetX + pushX;
                const targetY = node.baseY + floatOffsetY + pushY;

                // 物理模拟
                const springX = (targetX - node.x) * PARAMS.springConstant;
                const springY = (targetY - node.y) * PARAMS.springConstant;
                const damping = PARAMS.damping;
                node.vx = (node.vx + springX) * damping;
                node.vy = (node.vy + springY) * damping;
                node.x += node.vx;
                node.y += node.vy;

                // 限幅（防止跑太远）
                const maxOffset = 60;
                const dxLimit = node.x - node.baseX;
                const dyLimit = node.y - node.baseY;
                if (Math.abs(dxLimit) > maxOffset) node.x = node.baseX + Math.sign(dxLimit) * maxOffset;
                if (Math.abs(dyLimit) > maxOffset) node.y = node.baseY + Math.sign(dyLimit) * maxOffset;

                // ---- 亮度更新 ----
                let distToMouse = 9999;
                if (inside) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    distToMouse = Math.sqrt(dx * dx + dy * dy);
                }

                let targetBright = 0;
                if (inside && distToMouse < PARAMS.lightRadius) {
                    const t = distToMouse / PARAMS.lightRadius;
                    targetBright = (1 - t * t) * PARAMS.nodeBrightnessFactor;
                }

                const baseMult = node.baseBrightness || 0.5;
                targetBright = targetBright * (0.3 + 0.7 * baseMult);

                // 标题节点基础亮度更高
                if (node.isLetter) {
                    targetBright = Math.max(targetBright, 0.4 * baseMult);
                    targetBright *= PARAMS.letterBrightnessBoost;
                }

                node.targetBrightness = Math.min(targetBright, 1.0);
                node.brightness += (node.targetBrightness - node.brightness) * 0.05;
                node.phase += 0.003;
            }

            // ============================================================
            //  2. 更新涟漪
            // ============================================================
            updateRipples();

            // ============================================================
            //  3. 绘制标题连线（高亮，在普通连线之前绘制以确保在上层）
            // ============================================================
            if (STATE.letterConnections) {
                for (let conn of STATE.letterConnections) {
                    const n1 = STATE.nodes[conn.n1Idx];
                    const n2 = STATE.nodes[conn.n2Idx];
                    if (!n1 || !n2) continue;
                    const avgBright = (n1.brightness + n2.brightness) * 0.5;
                    const alpha = 0.25 + avgBright * 0.55;
                    ctx.beginPath();
                    ctx.moveTo(n1.x, n1.y);
                    ctx.lineTo(n2.x, n2.y);
                    ctx.strokeStyle = `rgba(255,255,255,${Math.min(alpha, 0.8)})`;
                    ctx.lineWidth = PARAMS.letterLineWidth + avgBright * 0.8;
                    ctx.stroke();
                }
            }

            // ============================================================
            //  4. 绘制普通连线（背景）
            // ============================================================
            const connectDist = Math.min(W, H) * 0.10;
            for (let i = 0; i < STATE.nodes.length; i++) {
                const n1 = STATE.nodes[i];
                if (n1.brightness < 0.01) continue;
                if (n1.isLetter) continue; // 标题节点连线已单独绘制
                for (let j = i + 1; j < STATE.nodes.length; j++) {
                    const n2 = STATE.nodes[j];
                    if (n2.isLetter) continue;
                    const dx = n1.x - n2.x;
                    const dy = n1.y - n2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectDist && dist > 5) {
                        const avgBright = (n1.brightness + n2.brightness) * 0.5;
                        const alpha = PARAMS.lineBaseAlpha + avgBright * PARAMS.lineBrightnessFactor;
                        if (alpha > 0.005) {
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = `rgba(255,255,255,${Math.min(alpha, 0.15)})`;
                            ctx.lineWidth = 0.2 + avgBright * 0.3;
                            ctx.stroke();
                        }
                    }
                }
            }

            // ============================================================
            //  5. 绘制涟漪
            // ============================================================
            for (let ripple of STATE.ripples) {
                if (!ripple.isActive) continue;
                const life = ripple.life;
                const r = ripple.radius;
                const strength = ripple.strength;
                const baseBright = Math.min(1, strength / 12) * 1.4;
                const alpha = life * baseBright * PARAMS.rippleAlphaBase;
                if (alpha < 0.001) continue;

                const layers = Math.min(4, 2 + Math.floor(strength / 5));
                for (let layer = 0; layer < layers; layer++) {
                    const offset = layer * 3 * (1 - life * 0.2);
                    const rad = r + offset;
                    if (rad > ripple.maxRadius + 15) continue;
                    const segments = 40 + Math.floor(rad * 0.3);
                    const distortion = PARAMS.waveDistortion * ripple.distortionAmp * (0.5 + 0.5 * Math.sin(life * 2));
                    ctx.beginPath();
                    for (let k = 0; k <= segments; k++) {
                        const angle = (k / segments) * Math.PI * 2;
                        const wave1 = Math.sin(angle * PARAMS.waveFrequency + STATE.frame * 0.015 + ripple.distortionSeed) *
                            distortion * 2;
                        const wave2 = Math.cos(angle * 1.3 + STATE.frame * 0.01 + ripple.distortionSeed * 0.7) * distortion *
                            1.2;
                        const wave3 = Math.sin(angle * 2.7 + STATE.frame * 0.008 + ripple.distortionSeed * 1.3) * distortion *
                            0.8;
                        const offsetR = (wave1 + wave2 + wave3) * 0.15;
                        const finalR = Math.max(0, rad + offsetR);
                        const px = ripple.x + finalR * Math.cos(angle);
                        const py = ripple.y + finalR * Math.sin(angle);
                        if (k === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    const layerAlpha = alpha * (1 - layer / layers) * (0.7 + 0.3 * Math.sin(life * 3 + layer));
                    ctx.strokeStyle = `rgba(255,255,255,${Math.min(layerAlpha, 0.18)})`;
                    ctx.lineWidth = 0.3 + (1 - life) * 0.6 + strength * 0.015;
                    ctx.stroke();
                }
                if (life > 0.3) {
                    const centerAlpha = life * Math.min(1, strength / 20) * 0.12;
                    const cSize = 1.5 + (1 - life) * 3 + strength * 0.04;
                    const shiftX = Math.sin(STATE.frame * 0.02 + ripple.distortionSeed) * 0.5;
                    const shiftY = Math.cos(STATE.frame * 0.018 + ripple.distortionSeed * 0.7) * 0.5;
                    ctx.beginPath();
                    ctx.arc(ripple.x + shiftX, ripple.y + shiftY, cSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${Math.min(centerAlpha, 0.18)})`;
                    ctx.fill();
                }
            }

            // ============================================================
            //  6. 绘制节点
            // ============================================================
            for (let node of STATE.nodes) {
                const b = node.brightness;
                const baseMult = node.baseBrightness || 0.5;
                const finalBright = Math.max(PARAMS.nodeBaseBrightness * (0.3 + 0.7 * baseMult), b);
                const size = (node.isLetter ? PARAMS.letterNodeSize : 1.0) * (0.6 + finalBright * 3.0);
                const alpha = Math.min(finalBright * 0.5, 0.4);

                // 光晕（标题节点光晕更大）
                const glowMult = node.isLetter ? 2.0 : 1.0;
                if (finalBright > 0.02) {
                    const glowR = (4 + finalBright * 25) * glowMult;
                    const distX = Math.sin(STATE.frame * 0.005 + node.waveOffset) * 0.3;
                    const distY = Math.cos(STATE.frame * 0.007 + node.waveOffset * 0.8) * 0.3;
                    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowR);
                    grad.addColorStop(0, `rgba(255,255,255,${finalBright * 0.06 * glowMult})`);
                    grad.addColorStop(0.5, `rgba(255,255,255,${finalBright * 0.03 * glowMult})`);
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(node.x + distX, node.y + distY, glowR, glowR * (0.9 + 0.1 * Math.sin(STATE.frame * 0.01 +
                        node.phase)), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 节点核心
                ctx.beginPath();
                ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fill();

                // 高光点
                if (finalBright > 0.2) {
                    ctx.beginPath();
                    ctx.arc(node.x - size * 0.2, node.y - size * 0.2, size * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${finalBright * 0.14})`;
                    ctx.fill();
                }
            }

            // ============================================================
            //  7. 鼠标触发节点涟漪
            // ============================================================
            if (inside) {
                for (let node of STATE.nodes) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.nodeTriggerDist && node.brightness > 0.08) {
                        let hasRecent = false;
                        for (let r of STATE.ripples) {
                            const d2 = Math.sqrt((r.x - node.x) ** 2 + (r.y - node.y) ** 2);
                            if (d2 < 8 && r.life > 0.5) { hasRecent = true; break; }
                        }
                        if (!hasRecent) {
                            triggerNodeRipple(node, 7 + Math.random() * 4);
                        }
                    }
                }
            }

            // ============================================================
            //  8. 鼠标光圈
            // ============================================================
            if (inside && mx > 0 && mx < W && my > 0 && my < H) {
                const mainR = PARAMS.lightRadius;

                const segments = 60;
                const waveAmp = 5 + Math.sin(STATE.frame * 0.015) * 3;
                ctx.beginPath();
                for (let k = 0; k <= segments; k++) {
                    const angle = (k / segments) * Math.PI * 2;
                    const wave1 = Math.sin(angle * 3 + STATE.frame * 0.02) * waveAmp * 0.5;
                    const wave2 = Math.cos(angle * 5 + STATE.frame * 0.015 + 1.2) * waveAmp * 0.3;
                    const wave3 = Math.sin(angle * 7 + STATE.frame * 0.01 + 2.5) * waveAmp * 0.2;
                    const offsetR = wave1 + wave2 + wave3;
                    const finalR = Math.max(mainR + offsetR, 10);
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, mainR + 15);
                grad.addColorStop(0, `rgba(255,255,255,${PARAMS.mouseGlowIntensity})`);
                grad.addColorStop(0.4, `rgba(255,255,255,${PARAMS.mouseGlowIntensity * 0.5})`);
                grad.addColorStop(0.8, `rgba(255,255,255,${PARAMS.mouseGlowIntensity * 0.15})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad;
                ctx.fill();

                const midR = 45;
                const grad2 = ctx.createRadialGradient(mx, my, 0, mx, my, midR);
                grad2.addColorStop(0, `rgba(255,255,255,${PARAMS.mouseMidGlow})`);
                grad2.addColorStop(0.6, `rgba(255,255,255,${PARAMS.mouseMidGlow * 0.4})`);
                grad2.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(mx, my, midR, 0, Math.PI * 2);
                ctx.fill();

                const pulse = 1 + Math.sin(STATE.frame * 0.02) * 0.06;
                ctx.beginPath();
                ctx.arc(mx, my, 2.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${PARAMS.mouseCoreGlow})`;
                ctx.fill();

                const innerR = 14 * pulse;
                const grad3 = ctx.createRadialGradient(mx, my, 0, mx, my, innerR);
                grad3.addColorStop(0, `rgba(255,255,255,${PARAMS.mouseInnerGlow})`);
                grad3.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(mx, my, innerR, 0, Math.PI * 2);
                ctx.fill();

                const cross = 10;
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 0.3;
                ctx.beginPath();
                ctx.moveTo(mx - cross, my);
                ctx.lineTo(mx + cross, my);
                ctx.moveTo(mx, my - cross);
                ctx.lineTo(mx, my + cross);
                ctx.stroke();

                const breatheR = 50 + Math.sin(STATE.frame * 0.015) * 4;
                ctx.beginPath();
                for (let k = 0; k <= 50; k++) {
                    const angle = (k / 50) * Math.PI * 2;
                    const bw = Math.sin(angle * 4 + STATE.frame * 0.025) * 2;
                    const finalR = breatheR + bw;
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 0.3;
                ctx.stroke();
            }

            // ---- 角落信息 ----
            const rippleCount = STATE.ripples.filter(r => r.isActive).length;
            ctx.fillStyle = 'rgba(255,255,255,0.006)';
            ctx.font = '8px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`涟漪 ${rippleCount} · 节点 ${STATE.nodes.length}`, W - 44, H - 20);

            requestAnimationFrame(draw);
        }

        // ============================================================
        //  启动
        // ============================================================
        resize();
        draw();

        document.addEventListener('click', () => {
            if (!STATE.audioCtx) initAudio();
        }, { once: true });

        console.log('✦ Ripple — 光 · 涟漪');
        console.log('✦ 节点拼标题 (固定坐标) · 每次刷新形状一致');
        console.log(`✦ 推开幅度: 普通 ${PARAMS.pushStrength}px · 标题 ${PARAMS.letterPushStrength}px`);
    </script>
</body>
</html>
