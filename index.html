<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>光 · 涟漪 — Ripple</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        /* ... 样式保持不变 ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Helvetica Neue', -apple-system, sans-serif;
            background: #06080a;
            color: #fff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            touch-action: none;
        }

        #demo-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #06080a;
            cursor: none;
        }

        #demo-section canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .nav-link {
            position: absolute;
            bottom: 40px;
            left: 44px;
            z-index: 10;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.10);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 10px 28px;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: rgba(255, 255, 255, 0.01);
            font-family: inherit;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-link:hover {
            color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-link:active {
            opacity: 0.6;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            right: 44px;
            z-index: 10;
            font-size: 9px;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.02);
            text-align: right;
            line-height: 2;
            pointer-events: none;
            user-select: none;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .nav-link {
                bottom: 24px;
                left: 24px;
                font-size: 9px;
                padding: 8px 18px;
            }
            .hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .nav-link {
                bottom: 16px;
                left: 16px;
                font-size: 8px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <section id="demo-section">
        <a class="nav-link" href="about.html">↗ 关于项目</a>
        <div class="hint">移动 · 光随行<br />涟漪 · 自生发</div>
    </section>

    <script>
        // ============================================================
        //  全局状态
        // ============================================================
        const STATE = {
            nodes: [],
            ripples: [],
            mouseX: -9999,
            mouseY: -9999,
            mouseInside: false,
            frame: 0,
            isMobile: false,
            mouseVX: 0,
            mouseVY: 0,
            prevMouseX: -9999,
            prevMouseY: -9999,

            audioCtx: null,
            bgmBuffer: null,
            waterBuffer: null,
            bgmSource: null,
            bgmGain: null,
            waterSource: null,
            waterGain: null,
            waterLooping: false,
            waterFadeTimer: null,
            audioReady: false,
            mouseActive: false,
            mouseStopTimer: null,

            autoRippleTimer: null,
        };

        // ============================================================
        //  Canvas 初始化
        // ============================================================
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const demoSection = document.getElementById('demo-section');
        demoSection.prepend(canvas);

        let W, H, dpr = 1;

        // ============================================================
        //  检测设备
        // ============================================================
        function checkMobile() {
            STATE.isMobile = window.innerWidth <= 768 || ('ontouchstart' in window && window.innerWidth <= 1024);
            return STATE.isMobile;
        }

        // ============================================================
        //  参数
        // ============================================================
        const PARAMS = {
            nodeCountDesktop: 150,
            nodeCountMobile: 70,

            lightRadius: 170,
            nodeTriggerDist: 75,
            rippleSpeedBase: 0.38,
            rippleDecay: 0.27,
            minStrength: 1.0,
            nodeBaseBrightness: 0.012,
            nodeBrightnessFactor: 1.2,
            lineBaseAlpha: 0.008,
            lineBrightnessFactor: 0.18,

            rippleAlphaBase: 0.24,
            rippleCooldown: 500,

            waveDistortion: 1.4,
            waveFrequency: 4.0,

            floatAmplitude: 2.0,
            floatSpeed: 0.004,

            pushRadius: 100,
            pushStrength: 6,
            springConstant: 0.012,
            damping: 0.985,

            // ===== 自动涟漪（简化为一组，缓慢呼吸） =====
            autoRippleIntervalMin: 8000,
            autoRippleIntervalMax: 15000,
            autoRippleCountMin: 2,
            autoRippleCountMax: 4,
            autoRippleBrightness: 15,

            manualRippleBrightness: 10,

            autoRippleHighlightDuration: 500,

            mouseGlowIntensity: 0.10,
            mouseMidGlow: 0.06,
            mouseCoreGlow: 0.25,
            mouseInnerGlow: 0.10,

            titleText: 'Ripple',
            titleSize: 0.075,
            titleY: 0.18,
            titleLetterSpacing: 0.06,

            glowLayerAlpha: 0.30,
            glowLayerBlur: 45,

            textLayerAlpha: 0.55,
            textLayerGlow: 8,
            textLayerGlowAlpha: 0.08,

            rippleStretchStrength: 0.6,

            // ===== 音频参数 =====
            bgmVolume: 0.5,
            waterVolume: 0.4,
            waterFadeIn: 0.3,
            waterFadeOut: 0.3,
            waterStopDelay: 500,
        };

        // ============================================================
        //  生成普通节点
        // ============================================================
        function generateNodes() {
            const allNodes = [];
            const isMobile = checkMobile();
            const targetCount = isMobile ? PARAMS.nodeCountMobile : PARAMS.nodeCountDesktop;

            const minDist = Math.min(W, H) * 0.032;
            const margin = 30;
            let attempts = 0;
            const maxAttempts = 10000;

            const titleRegionY = H * 0.05;
            const titleRegionH = H * 0.25;
            const titleRegionX = W * 0.10;
            const titleRegionW = W * 0.80;

            const brightnessLevels = [];
            for (let i = 0; i < targetCount; i++) {
                brightnessLevels.push(0.1 + Math.random() * 0.9);
            }

            const tempNodes = [];
            let idx = 0;
            while (tempNodes.length < targetCount && attempts < maxAttempts) {
                attempts++;
                const x = margin + Math.random() * (W - 2 * margin);
                const y = margin + Math.random() * (H - 2 * margin);

                const inTitleRegion = y > titleRegionY && y < titleRegionY + titleRegionH &&
                    x > titleRegionX && x < titleRegionX + titleRegionW;
                let skip = false;
                if (inTitleRegion && Math.random() > 0.25) {
                    skip = true;
                }

                if (!skip) {
                    let tooClose = false;
                    for (let n of tempNodes) {
                        const dx = n.x - x;
                        const dy = n.y - y;
                        if (dx * dx + dy * dy < minDist * minDist) { tooClose = true; break; }
                    }
                    if (!tooClose) {
                        const brightBase = brightnessLevels[idx % brightnessLevels.length];
                        tempNodes.push({
                            id: allNodes.length,
                            x: x,
                            y: y,
                            baseX: x,
                            baseY: y,
                            brightness: brightBase * 0.3,
                            targetBrightness: 0,
                            phase: Math.random() * Math.PI * 2,
                            waveOffset: Math.random() * 100,
                            vx: 0,
                            vy: 0,
                            baseBrightness: brightBase,
                            lastRippleTime: 0,
                            highlightUntil: 0,
                        });
                        idx++;
                    }
                }
            }
            allNodes.push(...tempNodes);

            STATE.nodes = allNodes;
            console.log(`✦ 生成 ${allNodes.length} 个节点 (手机模式: ${isMobile})`);
        }

        // ============================================================
        //  绘制手写花体标题
        // ============================================================
        function drawTitle() {
            const text = PARAMS.titleText;
            const fontSize = Math.min(W * PARAMS.titleSize, H * 0.12);
            const baseY = H * PARAMS.titleY;
            const cx = W / 2;
            const cy = baseY;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const fontFamily = '"Great Vibes", "Alex Brush", "Tangerine", "Georgia", serif';
            ctx.font = `${fontSize}px ${fontFamily}`;

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.3})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur * 1.5;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.15;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.12})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.4})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.30;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.15})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.6})`;
            ctx.shadowBlur = PARAMS.glowLayerBlur * 0.5;
            ctx.globalAlpha = PARAMS.glowLayerAlpha * 0.40;
            ctx.fillStyle = `rgba(220,225,235,${PARAMS.glowLayerAlpha * 0.20})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const charOffset = (i - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const charX = cx + charOffset;
                const charY = cy;

                for (let ring = 0; ring < 3; ring++) {
                    const radius = fontSize * (0.4 + ring * 0.35) + Math.sin(STATE.frame * 0.01 + i * 0.5 + ring) * 2.5;
                    const grad = ctx.createRadialGradient(
                        charX, charY + 2, 0,
                        charX, charY + 2, radius
                    );
                    const alpha = 0.04 - ring * 0.01 + 0.02 * Math.sin(STATE.frame * 0.008 + i + ring * 0.5);
                    grad.addColorStop(0, `rgba(220,225,235,${Math.max(alpha, 0.002)})`);
                    grad.addColorStop(0.5, `rgba(220,225,235,${Math.max(alpha * 0.6, 0.001)})`);
                    grad.addColorStop(1, 'rgba(220,225,235,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(charX, charY + 2, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.save();
            ctx.shadowColor = `rgba(220,225,235,${PARAMS.textLayerGlowAlpha})`;
            ctx.shadowBlur = PARAMS.textLayerGlow;
            ctx.globalAlpha = PARAMS.textLayerAlpha * 0.7;
            ctx.fillStyle = `rgba(235,240,248,${PARAMS.textLayerAlpha * 0.8})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = PARAMS.textLayerAlpha * 0.85;
            ctx.fillStyle = `rgba(245,248,252,${PARAMS.textLayerAlpha * 0.9})`;
            ctx.fillText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.08;
            ctx.strokeStyle = 'rgba(200,210,225,0.15)';
            ctx.lineWidth = 0.4;
            ctx.strokeText(text, cx, cy + 2);
            ctx.restore();

            ctx.save();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 0.06;
            ctx.fillStyle = 'rgba(255,255,255,0.04)';
            ctx.fillText(text, cx - 1, cy);
            ctx.restore();

            for (let i = 0; i < text.length - 1; i++) {
                const charOffset1 = (i - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const charOffset2 = (i + 1 - (text.length - 1) / 2) * fontSize * (0.75 + PARAMS.titleLetterSpacing);
                const midX = cx + (charOffset1 + charOffset2) / 2;
                const dotY = cy + fontSize * 0.28 + Math.sin(STATE.frame * 0.01 + i * 1.1) * 2;
                const dotSize = 0.6 + 0.5 * Math.sin(STATE.frame * 0.015 + i * 0.7);
                ctx.beginPath();
                ctx.arc(midX, dotY, dotSize, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,210,225,${0.04 + 0.015 * Math.sin(STATE.frame * 0.01 + i)})`;
                ctx.fill();
            }

            const totalWidth = text.length * fontSize * (0.75 + PARAMS.titleLetterSpacing);
            const lineY = cy + fontSize * 0.58 + Math.sin(STATE.frame * 0.008) * 1.5;
            const lineStartX = cx - totalWidth * 0.48;
            const lineEndX = cx + totalWidth * 0.48;

            ctx.beginPath();
            ctx.moveTo(lineStartX, lineY);
            ctx.lineTo(lineEndX, lineY);
            ctx.strokeStyle = `rgba(200,210,225,${0.025 + 0.01 * Math.sin(STATE.frame * 0.01)})`;
            ctx.lineWidth = 0.3;
            ctx.stroke();

            const lineY2 = lineY + 5 + Math.sin(STATE.frame * 0.012 + 0.5) * 1.5;
            ctx.beginPath();
            ctx.moveTo(lineStartX + 15, lineY2);
            ctx.lineTo(lineEndX - 15, lineY2);
            ctx.strokeStyle = `rgba(200,210,225,${0.015 + 0.006 * Math.sin(STATE.frame * 0.012)})`;
            ctx.lineWidth = 0.2;
            ctx.stroke();

            const dotPositions = [
                [lineStartX, lineY],
                [lineEndX, lineY],
                [lineStartX + 8, lineY2],
                [lineEndX - 8, lineY2]
            ];
            for (let dp of dotPositions) {
                const ds = 0.5 + 0.3 * Math.sin(STATE.frame * 0.01 + dp[0]);
                ctx.beginPath();
                ctx.arc(dp[0], dp[1], ds, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,210,225,${0.025 + 0.015 * Math.sin(STATE.frame * 0.01 + dp[0])})`;
                ctx.fill();
            }
        }

        // ============================================================
        //  音频系统（纯音频文件）
        // ============================================================

        async function loadAudioFiles() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx) return false;

                const bgmResp = await fetch('bgm.mp3');
                const bgmArrayBuffer = await bgmResp.arrayBuffer();
                STATE.bgmBuffer = await ctx.decodeAudioData(bgmArrayBuffer);
                console.log('✦ 背景音乐加载成功');

                const waterResp = await fetch('water.mp3');
                const waterArrayBuffer = await waterResp.arrayBuffer();
                STATE.waterBuffer = await ctx.decodeAudioData(waterArrayBuffer);
                console.log('✦ 水声加载成功');

                return true;
            } catch (e) {
                console.warn('✦ 音频文件加载失败，请确保 bgm.mp3 和 water.mp3 在根目录:', e);
                return false;
            }
        }

        async function initAudio() {
            if (STATE.audioReady) return;

            try {
                if (!STATE.audioCtx) {
                    STATE.audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }

                if (STATE.audioCtx.state === 'suspended') {
                    await STATE.audioCtx.resume();
                }

                if (STATE.audioCtx.state !== 'running') {
                    console.warn('✦ AudioContext 未能启动');
                    return;
                }

                const loaded = await loadAudioFiles();
                if (!loaded) {
                    console.warn('✦ 音频文件加载失败，跳过音频初始化');
                    return;
                }

                playBGM();
                STATE.audioReady = true;
                console.log('✦ 音频系统初始化完成 ✓');

            } catch (e) {
                console.warn('✦ 音频初始化失败:', e);
            }
        }

        function playBGM() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx || !STATE.bgmBuffer) return;

                if (STATE.bgmSource) {
                    try { STATE.bgmSource.stop(); } catch (e) {}
                }

                const source = ctx.createBufferSource();
                source.buffer = STATE.bgmBuffer;
                source.loop = true;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(PARAMS.bgmVolume, ctx.currentTime);

                source.connect(gain);
                gain.connect(ctx.destination);

                source.start(ctx.currentTime);

                STATE.bgmSource = source;
                STATE.bgmGain = gain;

                console.log('✦ 背景音乐已开始播放');
            } catch (e) {
                console.warn('✦ 背景音乐播放失败:', e);
            }
        }

        function startWaterSound() {
            try {
                const ctx = STATE.audioCtx;
                if (!ctx || !STATE.waterBuffer) return;

                if (STATE.waterLooping) return;

                if (STATE.mouseStopTimer) {
                    clearTimeout(STATE.mouseStopTimer);
                    STATE.mouseStopTimer = null;
                }

                const source = ctx.createBufferSource();
                source.buffer = STATE.waterBuffer;
                source.loop = true;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(PARAMS.waterVolume, ctx.currentTime + PARAMS.waterFadeIn);

                source.connect(gain);
                gain.connect(ctx.destination);

                source.start(ctx.currentTime);

                STATE.waterSource = source;
                STATE.waterGain = gain;
                STATE.waterLooping = true;

                console.log('✦ 水声开始 (渐入)');
            } catch (e) {
                console.warn('✦ 水声播放失败:', e);
            }
        }

        function stopWaterSound(immediate = false) {
            try {
                if (!STATE.waterLooping || !STATE.waterGain) {
                    STATE.waterLooping = false;
                    return;
                }

                const ctx = STATE.audioCtx;
                if (!ctx) return;

                if (immediate) {
                    STATE.waterGain.gain.setValueAtTime(0, ctx.currentTime);
                    STATE.waterLooping = false;
                    if (STATE.waterSource) {
                        try { STATE.waterSource.stop(); } catch (e) {}
                        STATE.waterSource = null;
                    }
                    STATE.waterGain = null;
                    console.log('✦ 水声立即停止');
                    return;
                }

                const currentGain = STATE.waterGain.gain.value;
                STATE.waterGain.gain.setValueAtTime(currentGain, ctx.currentTime);
                STATE.waterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + PARAMS.waterFadeOut);

                setTimeout(() => {
                    if (STATE.waterSource) {
                        try { STATE.waterSource.stop(); } catch (e) {}
                        STATE.waterSource = null;
                    }
                    STATE.waterGain = null;
                    STATE.waterLooping = false;
                    console.log('✦ 水声已淡出');
                }, PARAMS.waterFadeOut * 1000 + 100);

            } catch (e) {
                console.warn('✦ 水声停止失败:', e);
                STATE.waterLooping = false;
            }
        }

        function handleMouseMove() {
            if (!STATE.mouseActive) {
                STATE.mouseActive = true;
                startWaterSound();
            }

            if (STATE.mouseStopTimer) {
                clearTimeout(STATE.mouseStopTimer);
                STATE.mouseStopTimer = null;
            }
        }

        function handleMouseStop() {
            if (STATE.mouseStopTimer) {
                clearTimeout(STATE.mouseStopTimer);
            }
            STATE.mouseStopTimer = setTimeout(() => {
                STATE.mouseActive = false;
                stopWaterSound(false);
                STATE.mouseStopTimer = null;
            }, PARAMS.waterStopDelay);
        }

        // ============================================================
        //  涟漪系统
        // ============================================================
        function createRipple(x, y, brightness, maxRadiusOverride, vx, vy, isAuto) {
            const speed = PARAMS.rippleSpeedBase + brightness * 0.015 + (Math.random() - 0.5) * 0.06;
            const maxRadius = maxRadiusOverride || (40 + brightness * 2.5 + Math.random() * 20);

            const speedVal = Math.sqrt(vx * vx + vy * vy);
            let stretchAngle = 0,
                stretchAmount = 0;
            if (speedVal > 0.3) {
                stretchAngle = Math.atan2(vy, vx);
                stretchAmount = Math.min(speedVal * 0.08, 0.5) * PARAMS.rippleStretchStrength;
            }

            STATE.ripples.push({
                x,
                y,
                radius: 0,
                maxRadius,
                life: 1.0,
                speed,
                brightness,
                triggeredSet: new Set(),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.4 + Math.random() * 0.8,
                randomAngle: Math.random() * Math.PI * 2,
                wavePhase: Math.random() * Math.PI * 2,
                stretchAngle: stretchAngle,
                stretchAmount: stretchAmount,
                isAuto: isAuto || false,
            });
        }

        function triggerNodeRipple(node, brightness, vx, vy) {
            const now = performance.now();
            if (node.lastRippleTime && (now - node.lastRippleTime) < PARAMS.rippleCooldown) {
                return;
            }
            node.lastRippleTime = now;

            const s = brightness * (0.7 + Math.random() * 0.6);
            const maxR = 30 + s * 2.0 + Math.random() * 15;

            const speedVal = Math.sqrt(vx * vx + vy * vy);
            let stretchAngle = 0,
                stretchAmount = 0;
            if (speedVal > 0.3) {
                stretchAngle = Math.atan2(vy, vx);
                stretchAmount = Math.min(speedVal * 0.08, 0.5) * PARAMS.rippleStretchStrength;
            }

            STATE.ripples.push({
                x: node.x,
                y: node.y,
                radius: 0,
                maxRadius: maxR,
                life: 1.0,
                speed: PARAMS.rippleSpeedBase + s * 0.008 + (Math.random() - 0.5) * 0.05,
                brightness: s,
                triggeredSet: new Set([node.id]),
                isActive: true,
                phaseOffset: Math.random() * Math.PI * 2,
                distortionSeed: Math.random() * 100,
                distortionAmp: 0.3 + Math.random() * 0.7,
                randomAngle: Math.random() * Math.PI * 2,
                isSecondary: true,
                wavePhase: Math.random() * Math.PI * 2,
                stretchAngle: stretchAngle,
                stretchAmount: stretchAmount,
                isAuto: false,
            });
        }

        function updateRipples() {
            const toRemove = [];
            for (let i = 0; i < STATE.ripples.length; i++) {
                const ripple = STATE.ripples[i];
                if (!ripple.isActive) continue;
                ripple.radius += ripple.speed;
                ripple.life -= 0.005;
                if (ripple.life <= 0 || ripple.radius > ripple.maxRadius) {
                    ripple.isActive = false;
                    toRemove.push(i);
                    continue;
                }
                if (ripple.brightness < PARAMS.minStrength) continue;
                const newBrightness = ripple.brightness * PARAMS.rippleDecay * (0.9 + Math.random() * 0.2);
                if (newBrightness < PARAMS.minStrength) continue;
                for (let node of STATE.nodes) {
                    if (ripple.triggeredSet.has(node.id)) continue;
                    const dx = node.x - ripple.x;
                    const dy = node.y - ripple.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const threshold = ripple.radius + 2 + (Math.random() - 0.5) * 4;
                    if (dist < threshold) {
                        ripple.triggeredSet.add(node.id);
                        setTimeout(() => {
                            triggerNodeRipple(node, newBrightness,
                                ripple.stretchAngle ? Math.cos(ripple.stretchAngle) * 1 : 0,
                                ripple.stretchAngle ? Math.sin(ripple.stretchAngle) * 1 : 0
                            );
                        }, Math.random() * 80);
                    }
                }
            }
            for (let i = toRemove.length - 1; i >= 0; i--) {
                STATE.ripples.splice(toRemove[i], 1);
            }
        }

        // ============================================================
        //  自动涟漪（简化为一组，缓慢呼吸）
        // ============================================================
        function scheduleAutoRipple() {
            const delay = PARAMS.autoRippleIntervalMin +
                Math.random() * (PARAMS.autoRippleIntervalMax - PARAMS.autoRippleIntervalMin);
            STATE.autoRippleTimer = setTimeout(() => {
                triggerAutoRipple();
                scheduleAutoRipple();
            }, delay);
        }

        function triggerAutoRipple() {
            const candidates = [...STATE.nodes];
            candidates.sort((a, b) => b.baseBrightness - a.baseBrightness);

            const count = PARAMS.autoRippleCountMin +
                Math.floor(Math.random() * (PARAMS.autoRippleCountMax - PARAMS.autoRippleCountMin + 1));
            const selected = [];

            const pool = candidates.slice(0, Math.min(candidates.length, Math.floor(candidates.length * 0.4)));
            const shuffled = pool.sort(() => Math.random() - 0.5);
            for (let i = 0; i < Math.min(count, shuffled.length); i++) {
                selected.push(shuffled[i]);
            }

            for (let node of selected) {
                const brightFactor = 0.7 + 0.6 * node.baseBrightness;
                const brightness = PARAMS.autoRippleBrightness * brightFactor;

                node.highlightUntil = performance.now() + PARAMS.autoRippleHighlightDuration;
                node.targetBrightness = 1.0;

                setTimeout(() => {
                    node.targetBrightness = 0.3;
                }, PARAMS.autoRippleHighlightDuration);

                const now = performance.now();
                if (!node.lastRippleTime || (now - node.lastRippleTime) >= PARAMS.rippleCooldown) {
                    node.lastRippleTime = now;
                    const angle = Math.random() * Math.PI * 2;
                    createRipple(node.x, node.y, brightness, undefined,
                        Math.cos(angle) * 0.3, Math.sin(angle) * 0.3,
                        true
                    );
                }
            }
        }

        // ============================================================
        //  绘制涟漪
        // ============================================================
        function drawRipples() {
            for (let ripple of STATE.ripples) {
                if (!ripple.isActive) continue;
                const life = ripple.life;
                const r = ripple.radius;
                const brightness = ripple.brightness;
                const baseBright = Math.min(1, brightness / 10) * 1.4;
                const alpha = life * baseBright * PARAMS.rippleAlphaBase;
                if (alpha < 0.001) continue;

                const stretchAngle = ripple.stretchAngle || 0;
                const stretchAmount = ripple.stretchAmount || 0;

                const layers = Math.min(5, 3 + Math.floor(brightness / 4));
                for (let layer = 0; layer < layers; layer++) {
                    const offset = layer * 3 * (1 - life * 0.2);
                    const rad = r + offset;
                    if (rad > ripple.maxRadius + 20) continue;
                    const segments = 50 + Math.floor(rad * 0.4);
                    const layerWave = ripple.wavePhase + layer * 0.8 + life * 0.5;
                    const distortion = PARAMS.waveDistortion * ripple.distortionAmp *
                        (0.4 + 0.6 * Math.sin(life * 2 + layer * 0.3)) *
                        (1 + 0.3 * Math.sin(rad * 0.05));

                    ctx.beginPath();
                    for (let k = 0; k <= segments; k++) {
                        const angle = (k / segments) * Math.PI * 2;
                        const wave1 = Math.sin(angle * PARAMS.waveFrequency + STATE.frame * 0.015 + ripple.distortionSeed +
                            layerWave) * distortion * 1.8;
                        const wave2 = Math.cos(angle * 2.3 + STATE.frame * 0.01 + ripple.distortionSeed * 0.7 + layerWave *
                            0.5) * distortion * 1.2;
                        const wave3 = Math.sin(angle * 4.7 + STATE.frame * 0.008 + ripple.distortionSeed * 1.3 + layerWave *
                            0.3) * distortion * 0.7;
                        const wave4 = Math.cos(angle * 1.1 + STATE.frame * 0.012 + ripple.distortionSeed * 0.4 + layerWave *
                            0.7) * distortion * 0.5;
                        const offsetR = (wave1 + wave2 + wave3 + wave4) * 0.2;
                        const finalR = Math.max(0, rad + offsetR);

                        const stretchedX = finalR * Math.cos(angle) * (1 + stretchAmount * 0.5 * Math.cos(stretchAngle));
                        const stretchedY = finalR * Math.sin(angle) * (1 + stretchAmount * 0.5 * Math.sin(stretchAngle));
                        const px = ripple.x + stretchedX;
                        const py = ripple.y + stretchedY;

                        if (k === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    const layerAlpha = alpha * (1 - layer / layers) * (0.6 + 0.4 * Math.sin(life * 2.5 + layer));
                    ctx.strokeStyle = `rgba(220,225,235,${Math.min(layerAlpha, 0.18)})`;
                    ctx.lineWidth = 0.2 + (1 - life) * 0.5 + brightness * 0.015;
                    ctx.stroke();
                }

                if (life > 0.3) {
                    const centerAlpha = life * Math.min(1, brightness / 15) * 0.12;
                    const cSize = 1.5 + (1 - life) * 3 + brightness * 0.04;
                    const shiftX = Math.sin(STATE.frame * 0.02 + ripple.distortionSeed) * 0.5;
                    const shiftY = Math.cos(STATE.frame * 0.018 + ripple.distortionSeed * 0.7) * 0.5;
                    ctx.beginPath();
                    ctx.arc(ripple.x + shiftX, ripple.y + shiftY, cSize, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220,225,235,${Math.min(centerAlpha, 0.18)})`;
                    ctx.fill();
                }
            }
        }

        // ============================================================
        //  鼠标 / 触摸
        // ============================================================
        function getPos(e) {
            const rect = demoSection.getBoundingClientRect();
            let cx, cy;
            if (e.touches) {
                cx = e.touches[0].clientX - rect.left;
                cy = e.touches[0].clientY - rect.top;
                e.preventDefault();
            } else {
                cx = e.clientX - rect.left;
                cy = e.clientY - rect.top;
            }
            return { x: cx, y: cy };
        }

        function onMove(e) {
            const pos = getPos(e);
            const newX = pos.x;
            const newY = pos.y;

            if (STATE.prevMouseX !== -9999) {
                const rawVx = newX - STATE.prevMouseX;
                const rawVy = newY - STATE.prevMouseY;
                STATE.mouseVX = STATE.mouseVX * 0.6 + rawVx * 0.4;
                STATE.mouseVY = STATE.mouseVY * 0.6 + rawVy * 0.4;
            }

            STATE.prevMouseX = newX;
            STATE.prevMouseY = newY;
            STATE.mouseX = newX;
            STATE.mouseY = newY;
            STATE.mouseInside = true;

            if (!STATE.audioReady) {
                initAudio();
            }
            handleMouseMove();
        }

        function onLeave() {
            STATE.mouseInside = false;
            STATE.mouseVX = 0;
            STATE.mouseVY = 0;
            handleMouseStop();
        }

        function onTap(e) {
            const pos = getPos(e);
            const brightness = PARAMS.manualRippleBrightness + Math.random() * 4;
            const maxR = 80 + brightness * 3 + Math.random() * 40;
            const angle = Math.random() * Math.PI * 2;
            createRipple(pos.x, pos.y, brightness, maxR, Math.cos(angle) * 0.3, Math.sin(angle) * 0.3, false);
            if (!STATE.audioReady) {
                initAudio();
            }
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseleave', onLeave);
        window.addEventListener('click', onTap);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchstart', onTap, { passive: false });
        window.addEventListener('touchend', onLeave, { passive: false });

        // ============================================================
        //  Resize
        // ============================================================
        function resize() {
            const rect = demoSection.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.scale(dpr, dpr);

            generateNodes();

            if (STATE.autoRippleTimer) {
                clearTimeout(STATE.autoRippleTimer);
            }
            scheduleAutoRipple();
        }

        window.addEventListener('resize', resize);

        // ============================================================
        //  渲染循环
        // ============================================================
        function draw() {
            STATE.frame++;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#06080a';
            ctx.fillRect(0, 0, W, H);

            const mx = STATE.mouseX;
            const my = STATE.mouseY;
            const inside = STATE.mouseInside;

            const now = performance.now();

            for (let node of STATE.nodes) {
                const floatOffsetX = Math.sin(STATE.frame * PARAMS.floatSpeed + node.phase) * PARAMS.floatAmplitude;
                const floatOffsetY = Math.cos(STATE.frame * PARAMS.floatSpeed * 0.8 + node.phase * 0.7) * PARAMS
                .floatAmplitude;

                let pushX = 0,
                    pushY = 0;
                if (inside) {
                    const dx = node.baseX + floatOffsetX - mx;
                    const dy = node.baseY + floatOffsetY - my;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.pushRadius && dist > 1) {
                        const strength = (1 - dist / PARAMS.pushRadius) * PARAMS.pushStrength;
                        pushX = (dx / dist) * strength;
                        pushY = (dy / dist) * strength;
                    }
                }

                const targetX = node.baseX + floatOffsetX + pushX;
                const targetY = node.baseY + floatOffsetY + pushY;

                const springX = (targetX - node.x) * PARAMS.springConstant;
                const springY = (targetY - node.y) * PARAMS.springConstant;
                const damping = PARAMS.damping;
                node.vx = (node.vx + springX) * damping;
                node.vy = (node.vy + springY) * damping;
                node.x += node.vx;
                node.y += node.vy;

                const maxOffset = 60;
                const dxLimit = node.x - node.baseX;
                const dyLimit = node.y - node.baseY;
                if (Math.abs(dxLimit) > maxOffset) node.x = node.baseX + Math.sign(dxLimit) * maxOffset;
                if (Math.abs(dyLimit) > maxOffset) node.y = node.baseY + Math.sign(dyLimit) * maxOffset;

                let distToMouse = 9999;
                if (inside) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    distToMouse = Math.sqrt(dx * dx + dy * dy);
                }

                let targetBright = 0;
                if (inside && distToMouse < PARAMS.lightRadius) {
                    const t = distToMouse / PARAMS.lightRadius;
                    targetBright = (1 - t * t) * PARAMS.nodeBrightnessFactor;
                }

                const baseMult = node.baseBrightness || 0.5;
                targetBright = targetBright * (0.3 + 0.7 * baseMult);

                if (node.highlightUntil && now < node.highlightUntil) {
                    targetBright = Math.max(targetBright, 1.0);
                }

                node.targetBrightness = Math.min(targetBright, 1.0);
                node.brightness += (node.targetBrightness - node.brightness) * 0.05;
                node.phase += 0.003;
            }

            updateRipples();

            const connectDist = Math.min(W, H) * 0.10;
            for (let i = 0; i < STATE.nodes.length; i++) {
                const n1 = STATE.nodes[i];
                if (n1.brightness < 0.01) continue;
                for (let j = i + 1; j < STATE.nodes.length; j++) {
                    const n2 = STATE.nodes[j];
                    const dx = n1.x - n2.x;
                    const dy = n1.y - n2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < connectDist && dist > 5) {
                        const avgBright = (n1.brightness + n2.brightness) * 0.5;
                        const alpha = PARAMS.lineBaseAlpha + avgBright * PARAMS.lineBrightnessFactor;
                        if (alpha > 0.005) {
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);
                            ctx.strokeStyle = `rgba(200,210,225,${Math.min(alpha, 0.12)})`;
                            ctx.lineWidth = 0.2 + avgBright * 0.3;
                            ctx.stroke();
                        }
                    }
                }
            }

            drawRipples();

            for (let node of STATE.nodes) {
                const b = node.brightness;
                const baseMult = node.baseBrightness || 0.5;
                const finalBright = Math.max(PARAMS.nodeBaseBrightness * (0.3 + 0.7 * baseMult), b);
                const size = 0.6 + finalBright * 3.0;
                const alpha = Math.min(finalBright * 0.45, 0.35);

                const isHighlighted = node.highlightUntil && now < node.highlightUntil;
                const glowMult = isHighlighted ? 2.5 : 1.0;

                if (finalBright > 0.02) {
                    const glowR = (4 + finalBright * 25) * glowMult;
                    const distX = Math.sin(STATE.frame * 0.005 + node.waveOffset) * 0.3;
                    const distY = Math.cos(STATE.frame * 0.007 + node.waveOffset * 0.8) * 0.3;
                    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, glowR);
                    grad.addColorStop(0, `rgba(220,230,240,${finalBright * 0.08 * glowMult})`);
                    grad.addColorStop(0.5, `rgba(200,210,225,${finalBright * 0.04 * glowMult})`);
                    grad.addColorStop(1, 'rgba(200,210,225,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(node.x + distX, node.y + distY, glowR, glowR * (0.9 + 0.1 * Math.sin(STATE.frame * 0.01 +
                        node.phase)), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                const grayVal = Math.floor(120 + finalBright * 120);
                ctx.beginPath();
                ctx.arc(node.x, node.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${grayVal},${grayVal + 5},${grayVal + 10},${alpha * 0.9})`;
                ctx.fill();

                if (finalBright > 0.2) {
                    ctx.beginPath();
                    ctx.arc(node.x - size * 0.2, node.y - size * 0.2, size * 0.25, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(230,235,240,${finalBright * 0.12})`;
                    ctx.fill();
                }
            }

            if (inside) {
                for (let node of STATE.nodes) {
                    const dx = mx - node.x;
                    const dy = my - node.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < PARAMS.nodeTriggerDist && node.brightness > 0.08) {
                        let hasRecent = false;
                        for (let r of STATE.ripples) {
                            const d2 = Math.sqrt((r.x - node.x) ** 2 + (r.y - node.y) ** 2);
                            if (d2 < 8 && r.life > 0.5) { hasRecent = true; break; }
                        }
                        if (!hasRecent) {
                            const brightness = PARAMS.manualRippleBrightness + Math.random() * 4;
                            triggerNodeRipple(node, brightness, STATE.mouseVX, STATE.mouseVY);
                        }
                    }
                }
            }

            if (inside && mx > 0 && mx < W && my > 0 && my < H) {
                const mainR = PARAMS.lightRadius;

                const segments = 60;
                const waveAmp = 5 + Math.sin(STATE.frame * 0.015) * 3;
                ctx.beginPath();
                for (let k = 0; k <= segments; k++) {
                    const angle = (k / segments) * Math.PI * 2;
                    const wave1 = Math.sin(angle * 3 + STATE.frame * 0.02) * waveAmp * 0.5;
                    const wave2 = Math.cos(angle * 5 + STATE.frame * 0.015 + 1.2) * waveAmp * 0.3;
                    const wave3 = Math.sin(angle * 7 + STATE.frame * 0.01 + 2.5) * waveAmp * 0.2;
                    const offsetR = wave1 + wave2 + wave3;
                    const finalR = Math.max(mainR + offsetR, 10);
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                const grad = ctx.createRadialGradient(mx, my, 0, mx, my, mainR + 15);
                grad.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseGlowIntensity})`);
                grad.addColorStop(0.4, `rgba(200,210,225,${PARAMS.mouseGlowIntensity * 0.5})`);
                grad.addColorStop(0.8, `rgba(200,210,225,${PARAMS.mouseGlowIntensity * 0.15})`);
                grad.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad;
                ctx.fill();

                const midR = 45;
                const grad2 = ctx.createRadialGradient(mx, my, 0, mx, my, midR);
                grad2.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseMidGlow})`);
                grad2.addColorStop(0.6, `rgba(200,210,225,${PARAMS.mouseMidGlow * 0.4})`);
                grad2.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(mx, my, midR, 0, Math.PI * 2);
                ctx.fill();

                const pulse = 1 + Math.sin(STATE.frame * 0.02) * 0.06;
                ctx.beginPath();
                ctx.arc(mx, my, 2.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(220,230,240,${PARAMS.mouseCoreGlow})`;
                ctx.fill();

                const innerR = 14 * pulse;
                const grad3 = ctx.createRadialGradient(mx, my, 0, mx, my, innerR);
                grad3.addColorStop(0, `rgba(200,210,225,${PARAMS.mouseInnerGlow})`);
                grad3.addColorStop(1, 'rgba(200,210,225,0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(mx, my, innerR, 0, Math.PI * 2);
                ctx.fill();

                const cross = 10;
                ctx.strokeStyle = 'rgba(200,210,225,0.015)';
                ctx.lineWidth = 0.3;
                ctx.beginPath();
                ctx.moveTo(mx - cross, my);
                ctx.lineTo(mx + cross, my);
                ctx.moveTo(mx, my - cross);
                ctx.lineTo(mx, my + cross);
                ctx.stroke();

                const breatheR = 50 + Math.sin(STATE.frame * 0.015) * 4;
                ctx.beginPath();
                for (let k = 0; k <= 50; k++) {
                    const angle = (k / 50) * Math.PI * 2;
                    const bw = Math.sin(angle * 4 + STATE.frame * 0.025) * 2;
                    const finalR = breatheR + bw;
                    const px = mx + finalR * Math.cos(angle);
                    const py = my + finalR * Math.sin(angle);
                    if (k === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(200,210,225,0.015)';
                ctx.lineWidth = 0.3;
                ctx.stroke();
            }

            drawTitle();

            const rippleCount = STATE.ripples.filter(r => r.isActive).length;
            ctx.fillStyle = 'rgba(200,210,225,0.004)';
            ctx.font = '8px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`涟漪 ${rippleCount} · 节点 ${STATE.nodes.length}`, W - 44, H - 20);

            requestAnimationFrame(draw);
        }

        // ============================================================
        //  启动
        // ============================================================
        resize();
        draw();

        document.addEventListener('click', () => {
            if (!STATE.audioReady) {
                initAudio();
            }
        }, { once: false });

        document.addEventListener('touchstart', () => {
            if (!STATE.audioReady) {
                initAudio();
            }
        }, { once: false });

        setTimeout(() => {
            if (!STATE.audioReady) {
                console.log('✦ 等待用户交互以激活音频...');
            }
        }, 1000);

        console.log('✦ Ripple — 光 · 涟漪 (暗色模式)');
        console.log('✦ 浮动幅度: 2.0');
        console.log('✦ 自动涟漪: 8-15秒 · 2-4个节点 · 亮度15');
        console.log('✦ 缓慢呼吸节奏');
        console.log('✦ 背景音乐 + 水声 (需用户交互后激活)');
    </script>
</body>
</html>
